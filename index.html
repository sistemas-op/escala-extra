<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escala de Serviço Extra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d141f; --panel:#16202e; --panel-2:#1c2a3c; --border:#25384d;
    --text:#e9eef4; --muted:#8a9bb0; --amber:#e8a33d; --amber-dim:#3a2e18;
    --green:#34d399; --green-dim:#12291f; --red:#ef5757; --red-dim:#331818;
    --blue:#5b9bd5; --blue-dim:#152838;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px 64px;}
  header{padding:28px 16px 18px;text-align:center;}
  header .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:var(--amber);text-transform:uppercase;}
  header .title-row{display:flex;align-items:stretch;justify-content:center;gap:16px;margin-top:8px;}
  header .title-block{display:flex;flex-direction:column;justify-content:center;min-width:0;}
  header .crest{height:auto;width:auto;max-width:110px;flex-shrink:0;object-fit:contain;}
  header h1{font-family:'Oswald',sans-serif;font-weight:600;font-size:26px;letter-spacing:.02em;margin:0;text-transform:uppercase;}
  header .battalion{margin-top:10px;}
  header .battalion .bat-line1{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.05em;color:var(--text);}
  header .battalion .bat-line2{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--muted);font-style:italic;margin-top:3px;}
  .stripe{height:4px;margin-top:16px;background:repeating-linear-gradient(45deg,var(--amber) 0 10px,transparent 10px 20px);opacity:.55;}
  @media (max-width:420px){
    header .crest{max-width:64px;}
    header .title-row{gap:10px;}
    header h1{font-size:22px;}
  }
  nav.tabs{display:flex;gap:4px;margin:20px 0 18px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:4px;}
  nav.tabs button{flex:1;padding:10px 8px;background:transparent;border:none;color:var(--muted);font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:.04em;text-transform:uppercase;border-radius:7px;cursor:pointer;}
  nav.tabs button.active{background:var(--panel-2);color:var(--amber);}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
  .shift-card{display:flex;gap:14px;}
  .shift-date{font-family:'Oswald',sans-serif;text-align:center;min-width:58px;background:var(--panel-2);border-radius:8px;padding:8px 4px;height:fit-content;}
  .shift-date .dow{font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;}
  .shift-date .dnum{font-size:22px;font-weight:600;line-height:1.1;}
  .shift-date .mon{font-size:10px;color:var(--muted);text-transform:uppercase;}
  .shift-body{flex:1;min-width:0;}
  .shift-time{font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--amber);}
  .shift-local{font-size:13px;color:var(--muted);margin-top:2px;}
  .shift-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:8px;}
  .badge{font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:3px 9px;border-radius:20px;display:inline-block;}
  .badge.open{background:var(--green-dim);color:var(--green);}
  .badge.full{background:var(--red-dim);color:var(--red);}
  .badge.phase{background:var(--blue-dim);color:var(--blue);}
  .names{margin-top:10px;font-size:13px;color:var(--muted);line-height:1.6;}
  .name-chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--border);padding:3px 8px 3px 10px;border-radius:20px;margin:2px 4px 2px 0;font-size:12.5px;}
  .btn{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:12.5px;border:none;border-radius:8px;padding:9px 13px;cursor:pointer;}
  .btn-primary{background:var(--amber);color:#1a1204;}
  .btn-primary:disabled{background:var(--panel-2);color:var(--muted);cursor:not-allowed;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-danger{background:var(--red-dim);color:var(--red);border:1px solid #4a2222;}
  .btn-blue{background:var(--blue-dim);color:var(--blue);border:1px solid #234258;}
  .btn-block{width:100%;margin-top:12px;}
  .btn-sm{padding:6px 10px;font-size:11px;}
  input,select{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;margin-top:6px;}
  label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-family:'Oswald',sans-serif;}
  .field{margin-bottom:12px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .empty{text-align:center;color:var(--muted);padding:36px 12px;font-size:14px;}
  .empty .big{font-family:'Oswald',sans-serif;font-size:16px;color:var(--text);text-transform:uppercase;margin-bottom:4px;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;}
  .modal h3{font-family:'Oswald',sans-serif;text-transform:uppercase;margin:0 0 14px;font-size:17px;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions .btn{flex:1;}
  .pin-gate{text-align:center;padding:50px 16px;}
  .pin-gate .lock{font-size:32px;margin-bottom:10px;}
  .pin-gate input{max-width:200px;margin:14px auto 0;text-align:center;letter-spacing:.3em;font-family:'JetBrains Mono',monospace;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:30px;font-size:13px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}
  .refresh-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .muted-sm{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
  .link-btn{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:12px;cursor:pointer;padding:0;}
  table.roster{width:100%;border-collapse:collapse;font-size:13px;}
  table.roster th{text-align:left;font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:11px;letter-spacing:.04em;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--border);}
  table.roster td{padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:middle;}
  table.roster input, table.roster select{margin-top:0;padding:6px 8px;font-size:12.5px;}
  .table-wrap{overflow-x:auto;}
  .rank-tag{font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:2px 7px;border-radius:10px;background:var(--panel-2);color:var(--muted);}
  .rank-tag.sgt{color:var(--amber);}
  .rank-tag.cabo{color:var(--blue);}
  .rank-tag.soldado{color:var(--green);}
  .app-footer{margin-top:28px;text-align:center;font-family:'Inter',sans-serif;font-size:11.5px;color:var(--muted);}

          <div class="bat-line1">16º BATALHÃO DE POLÍCIA MILITAR</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.7.2/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, onSnapshot, setDoc, updateDoc, getDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDINaHpd3Ig0JzlLe3TK_MQbICETdrQv1o",
  authDomain: "escala-extra-pmpr.firebaseapp.com",
  projectId: "escala-extra-pmpr",
  storageBucket: "escala-extra-pmpr.firebasestorage.app",
  messagingSenderId: "129550161576",
  appId: "1:129550161576:web:08d613bdc17399e628d49d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const docRef = doc(db, 'escala', 'estado');

if(window.pdfjsLib){
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

let shifts = [];
let signups = [];
let adminUnlocked = false;
let currentPin = null;
let editingShiftId = null;
let activeTab = 'vagas';
let importFormOpen = false; // true enquanto o admin está substituindo a escala oficial já importada
let escalaOficial = null;      // { A:[{nome,patente,cpf}], B:[...], C:[...], D:[...] }
let calendarioOficial = null;  // { 'YYYY-MM-DD': { dia:'A', noite:'B' }, ... }

const RANK_ORDER = ['sgt','cabo','soldado'];
const RANK_LABEL = {sgt:'Sargento', cabo:'Cabo', soldado:'Soldado'};
const TEAM_LETTERS = ['A','B','C','D'];
const TURNO_LABEL = { dia: 'Dia', noite: 'Noite' };

// Fases de liberação de uma vaga: grupos EXATOS e independentes (sem cascata).
// 'sgt'/'cabo'/'soldado' liberam só aquela patente; 'todos' libera as três.
const FASE_OPTIONS = [
  { v:'sgt', label:'Somente Sargentos' },
  { v:'cabo', label:'Somente Cabos' },
  { v:'soldado', label:'Somente Soldados' },
  { v:'todos', label:'Todos (Sgt, Cabo, Sd)' }
];
const FASE_LABEL = { sgt:'Somente Sargentos', cabo:'Somente Cabos', soldado:'Somente Soldados', todos:'Todos os postos/graduações' };

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }
function allowedRanks(fase){
  if(fase === 'todos') return ['sgt','cabo','soldado'];
  if(fase === 'sgt' || fase === 'cabo' || fase === 'soldado') return [fase];
  return ['sgt']; // fallback defensivo para valor de fase ausente/inesperado
}
function faseLabel(fase){ return FASE_LABEL[fase] || FASE_LABEL.sgt; }
function faseSelectOptions(selected){
  return FASE_OPTIONS.map(o=>'<option value="'+o.v+'" '+(o.v===selected?'selected':'')+'>'+o.label+'</option>').join('');
}
function metaLine(s){ const parts=[]; if(s.local) parts.push(s.local); if(s.viatura) parts.push('Viatura '+s.viatura); return parts.join(' &middot; '); }
function sortShifts(){ shifts.sort((a,b)=> (a.date+a.startTime).localeCompare(b.date+b.startTime)); }

// ---------- AUTOCOMPLETAR (datalists a partir dos dados já em memória) ----------

function uniqueNonEmpty(arr){
  const seen = new Set();
  const out = [];
  for(const v of arr){
    const t = (v||'').trim();
    if(!t || seen.has(t.toLowerCase())) continue;
    seen.add(t.toLowerCase());
    out.push(t);
  }
  return out;
}
function refreshDatalists(){
  const nomesEl = document.getElementById('datalist-nomes');
  const locaisEl = document.getElementById('datalist-locais');
  const viaturasEl = document.getElementById('datalist-viaturas');
  if(nomesEl) nomesEl.innerHTML = uniqueNonEmpty(signups.map(s=>s.nome)).map(v=>'<option value="'+escapeHtml(v)+'">').join('');
  if(locaisEl) locaisEl.innerHTML = uniqueNonEmpty(shifts.map(s=>s.local)).map(v=>'<option value="'+escapeHtml(v)+'">').join('');
  if(viaturasEl) viaturasEl.innerHTML = uniqueNonEmpty(shifts.map(s=>s.viatura)).map(v=>'<option value="'+escapeHtml(v)+'">').join('');
}

// ---------- FIRESTORE SYNC (documento único: escala/estado) ----------
// shifts e signups são guardados no documento como MAPAS (objeto id -> item),
// não como arrays. Isso permite gravar/apagar um item por vez (merge por
// caminho de campo), então duas abas mexendo em itens diferentes ao mesmo
// tempo nunca sobrescrevem uma a outra — só o item alterado é tocado.

function applyRemoteData(data){
  currentPin = data.pin ?? null;
  shifts = Object.values(data.shifts || {}).map(s=>({...s}));
  shifts.forEach(s=>{ if(!s.fase) s.fase='sgt'; });
  sortShifts();
  signups = Object.values(data.signups || {}).map(s=>({...s}));
  escalaOficial = data.escalaOficial || null;
  calendarioOficial = data.calendarioOficial || null;
}

function handlePersistError(e){
  console.error(e);
  showToast('Erro ao sincronizar com o servidor');
}

// Grava/atualiza campos de nível superior (ex: pin) preservando os demais.
function persist(patch){
  setDoc(docRef, patch, { merge: true }).catch(handlePersistError);
}

// Upsert/delete granulares: tocam só a chave do item alterado dentro do
// mapa shifts/signups, sem substituir o mapa inteiro.
function persistShiftUpsert(shift){
  setDoc(docRef, { shifts: { [shift.id]: shift } }, { merge: true }).catch(handlePersistError);
}
function persistShiftDelete(id, cascadeSignupIds){
  const patch = { shifts: { [id]: deleteField() } };
  if(cascadeSignupIds && cascadeSignupIds.length){
    patch.signups = {};
    cascadeSignupIds.forEach(sid=>{ patch.signups[sid] = deleteField(); });
  }
  setDoc(docRef, patch, { merge: true }).catch(handlePersistError);
}
function persistSignupUpsert(su){
  setDoc(docRef, { signups: { [su.id]: su } }, { merge: true }).catch(handlePersistError);
}
function persistSignupDelete(id){
  setDoc(docRef, { signups: { [id]: deleteField() } }, { merge: true }).catch(handlePersistError);
}
// Bulk upsert (ex: dados de exemplo): mescla várias chaves novas de uma vez.
function persistBulkUpsert(newShifts, newSignups){
  const patch = {};
  if(newShifts && newShifts.length){ patch.shifts = {}; newShifts.forEach(s=>{ patch.shifts[s.id] = s; }); }
  if(newSignups && newSignups.length){ patch.signups = {}; newSignups.forEach(su=>{ patch.signups[su.id] = su; }); }
  setDoc(docRef, patch, { merge: true }).catch(handlePersistError);
}
// "Apagar tudo": substitui os mapas inteiros por vazios (precisa de
// updateDoc, já que setDoc com merge:true e {} não apaga chaves existentes).
function persistWipeAll(){
  updateDoc(docRef, { shifts: {}, signups: {} }).catch(handlePersistError);
}

async function refreshAll(){
  try{
    const snap = await getDoc(docRef);
    if(snap.exists()) applyRemoteData(snap.data());
  }catch(e){}
  render();
}

const DOW = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const MON = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
function fmtDateParts(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return { dow: DOW[dt.getDay()], dnum: String(d).padStart(2,'0'), mon: MON[m-1] };
}
function signupsFor(shiftId){ return signups.filter(s => s.shiftId === shiftId); }

// ---------- CRUZAMENTO COM A ESCALA OFICIAL (RPA/COPOM) ----------

function maskCpf(value){
  let v = (value||'').replace(/\D/g,'').slice(0,11);
  if(v.length > 9) return v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
  if(v.length > 6) return v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
  if(v.length > 3) return v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
  return v;
}

function isValidCpfShape(cpf){
  return /^[0-9Xx]{3}\.[0-9Xx]{3}\.[0-9Xx]{3}-[0-9Xx]{2}$/.test((cpf||'').trim());
}

// Compara um CPF completo digitado (11 dígitos) com um CPF da escala oficial
// que pode vir parcialmente mascarado (X no lugar de dígitos ocultos).
function cpfMatchesMasked(inputDigits, storedCpfRaw){
  const stored = (storedCpfRaw||'').replace(/[.\-\s]/g,'').toUpperCase();
  if(stored.length !== 11 || inputDigits.length !== 11) return false;
  for(let i=0;i<11;i++){
    const c = stored[i];
    if(c === 'X') continue;
    if(c !== inputDigits[i]) return false;
  }
  return true;
}

function shiftDateStr(dateStr, deltaDays){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d + deltaDays);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}

// Turno Dia = 06:00–18:00. Turno Noite = 18:00–06:00 (atravessa a meia-noite).
// Retorna quais turnos oficiais (do próprio dia da vaga e, se for o caso, o
// turno Noite do dia anterior) se sobrepõem ao horário da vaga extra.
function overlappingTurnos(startTime, endTime){
  const toMin = t=>{ const [h,m]=t.split(':').map(Number); return h*60+m; };
  let s = toMin(startTime), e = toMin(endTime);
  if(e <= s) e += 1440; // vaga atravessa a meia-noite
  const overlaps = (aS,aE)=> s < aE && e > aS;
  const result = [];
  if(overlaps(360,1080)) result.push({ offsetDays:0, turno:'dia' });
  if(overlaps(1080,1800)) result.push({ offsetDays:0, turno:'noite' });
  if(s < 360) result.push({ offsetDays:-1, turno:'noite' }); // cauda do plantão noturno do dia anterior
  return result;
}

// Verifica se o CPF informado já está escalado no serviço normal em algum
// turno que se sobrepõe ao horário da vaga extra. Retorna null se não há
// conflito (ou se a escala oficial ainda não foi importada).
function findEscalaConflict(dateStr, startTime, endTime, cpfDigits){
  if(!escalaOficial || !calendarioOficial) return null;
  const turnos = overlappingTurnos(startTime, endTime);
  for(const t of turnos){
    const targetDate = t.offsetDays === 0 ? dateStr : shiftDateStr(dateStr, t.offsetDays);
    const diaCal = calendarioOficial[targetDate];
    if(!diaCal) continue;
    const equipeLetra = diaCal[t.turno];
    if(!equipeLetra) continue;
    const membros = escalaOficial[equipeLetra];
    if(!membros) continue;
    const found = membros.find(m=> cpfMatchesMasked(cpfDigits, m.cpf));
    if(found){
      return { equipe: equipeLetra, turnoLabel: TURNO_LABEL[t.turno], date: targetDate };
    }
  }
  return null;
}

// ---------- PUBLIC VIEW ----------

function renderVagas(){
  const el = document.getElementById('view-vagas');
  const today = new Date(); today.setHours(0,0,0,0);
  const upcoming = shifts.filter(s=>{ const [y,m,d]=s.date.split('-').map(Number); return new Date(y,m-1,d) >= today; });
  const openCount = upcoming.filter(s=> signupsFor(s.id).length < s.vagas).length;

  let html = '<div class="refresh-row"><span class="muted-sm">'+openCount+' vaga(s) em aberto</span><button class="link-btn" onclick="refreshAll()">Atualizar</button></div>';

  if(upcoming.length === 0){
    html += '<div class="card empty"><div class="big">Nenhuma vaga cadastrada</div>Assim que a administração publicar horários, eles aparecem aqui.</div>';
  } else {
    for(const s of upcoming){
      const su = signupsFor(s.id);
      const cheias = su.length >= s.vagas;
      const dp = fmtDateParts(s.date);
      html += '<div class="card shift-card">'
        + '<div class="shift-date"><div class="dow">'+dp.dow+'</div><div class="dnum">'+dp.dnum+'</div><div class="mon">'+dp.mon+'</div></div>'
        + '<div class="shift-body">'
        + '<div class="shift-time">'+s.startTime+' – '+s.endTime+'</div>'
        + (metaLine(s) ? '<div class="shift-local">'+metaLine(s)+'</div>' : '')
        + '<div class="shift-meta">'
        + '<span class="badge '+(cheias?'full':'open')+'">'+su.length+'/'+s.vagas+' preenchidas</span>'
        + '<span class="badge phase">'+faseLabel(s.fase)+'</span>'
        + '</div>'
        + '<div style="margin-top:10px;">'
        + '<button class="btn btn-primary" '+(cheias?'disabled':'')+' onclick="openSignupModal(\''+s.id+'\')">'+(cheias?'Esgotado':'Voluntariar-se')+'</button>'
        + '</div>'
        + (su.length ? '<div class="names">'+su.map(x=>'<span class="name-chip">'+escapeHtml(x.nome)+' <span class="rank-tag '+x.patente+'">'+RANK_LABEL[x.patente]+'</span></span>').join('')+'</div>' : '')
        + '<button class="link-btn" style="margin-top:8px;" onclick="openCancelModal(\''+s.id+'\')">Cancelar meu voluntariado</button>'
        + '</div></div>';
    }
  }
  el.innerHTML = html;
}

function rankOptions(allowed){
  return RANK_ORDER.map(r=>'<option value="'+r+'" '+(allowed.includes(r)?'':'disabled')+'>'+RANK_LABEL[r]+(allowed.includes(r)?'':' (ainda não liberado)')+'</option>').join('');
}

function openSignupModal(shiftId){
  const s = shifts.find(x=>x.id===shiftId);
  if(!s) return;
  const dp = fmtDateParts(s.date);
  const allowed = allowedRanks(s.fase);
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal">'
    + '<h3>Confirmar voluntariado</h3>'
    + '<div class="shift-local" style="margin-bottom:6px;">'+dp.dnum+'/'+dp.mon+' &middot; '+s.startTime+'–'+s.endTime+(metaLine(s)?(' &middot; '+metaLine(s)):'')+'</div>'
    + '<div class="badge phase" style="margin-bottom:14px;">'+faseLabel(s.fase)+'</div>'
    + '<div class="field"><label>Nome completo</label><input id="su-nome" list="datalist-nomes" placeholder="Ex: Sd Eduardo Silva" autofocus></div>'
    + '<div class="field"><label>Patente</label><select id="su-patente">'+rankOptions(allowed)+'</select></div>'
    + '<div class="field"><label>CPF</label><input id="su-cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric"></div>'
    + '<div class="modal-actions"><button class="btn btn-ghost" id="su-cancel">Cancelar</button><button class="btn btn-primary" id="su-confirm">Confirmar</button></div>'
    + '</div>';
  document.body.appendChild(bg);
  const cpfInput = bg.querySelector('#su-cpf');
  cpfInput.oninput = ()=>{ cpfInput.value = maskCpf(cpfInput.value); };
  bg.querySelector('#su-cancel').onclick = ()=> bg.remove();
  bg.querySelector('#su-confirm').onclick = ()=>{
    const nome = bg.querySelector('#su-nome').value.trim();
    const patente = bg.querySelector('#su-patente').value;
    const cpfMasked = cpfInput.value.trim();
    const cpfDigits = cpfMasked.replace(/\D/g,'');
    if(!nome){ showToast('Digite seu nome'); return; }
    if(cpfDigits.length !== 11){ showToast('Digite um CPF válido'); return; }
    const freshShift = shifts.find(x=>x.id===shiftId);
    if(!freshShift){ showToast('Vaga não encontrada'); bg.remove(); return; }
    const su = signupsFor(shiftId);
    if(!allowedRanks(freshShift.fase).includes(patente)){ showToast('Essa vaga ainda não está liberada para '+RANK_LABEL[patente]); return; }
    if(su.length >= freshShift.vagas){ showToast('Vaga esgotada, atualize a página'); bg.remove(); render(); return; }
    if(su.some(x=>x.nome.toLowerCase()===nome.toLowerCase())){ showToast('Você já está nesta vaga'); return; }
    const conflict = findEscalaConflict(freshShift.date, freshShift.startTime, freshShift.endTime, cpfDigits);
    if(conflict){
      showToast('Você já está escalado no serviço normal neste dia (Equipe '+conflict.equipe+', turno '+conflict.turnoLabel+'). Não é possível se voluntariar.');
      return;
    }
    const [vagaAno, vagaMes] = freshShift.date.split('-');
    const extrasNoMes = signups.filter(x=>{
      if((x.cpf||'').replace(/\D/g,'') !== cpfDigits) return false;
      const xs = shifts.find(sh=>sh.id===x.shiftId);
      if(!xs) return false;
      const [xAno, xMes] = xs.date.split('-');
      return xAno===vagaAno && xMes===vagaMes;
    }).length;
    if(extrasNoMes >= 10){
      showToast('Limite de 10 extras no mês atingido para este CPF.');
      return;
    }
    const entry = { id: uid(), shiftId, nome, patente, cpf: cpfMasked, timestamp: new Date().toISOString() };
    signups.push(entry);
    bg.remove();
    showToast('Voluntariado confirmado!');
    render();
    persistSignupUpsert(entry);
  };
}

function openCancelModal(shiftId){
  const s = shifts.find(x=>x.id===shiftId);
  if(!s) return;
  const dp = fmtDateParts(s.date);
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal">'
    + '<h3>Cancelar voluntariado</h3>'
    + '<div class="shift-local" style="margin-bottom:14px;">'+dp.dnum+'/'+dp.mon+' &middot; '+s.startTime+'–'+s.endTime+(metaLine(s)?(' &middot; '+metaLine(s)):'')+'</div>'
    + '<div class="field"><label>Digite o nome que você usou pra se voluntariar</label><input id="cn-nome" list="datalist-nomes" placeholder="Ex: Sd Eduardo Silva" autofocus></div>'
    + '<div class="field"><label>CPF</label><input id="cn-cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric"></div>'
    + '<div class="modal-actions"><button class="btn btn-ghost" id="cn-cancel">Voltar</button><button class="btn btn-danger" id="cn-confirm">Cancelar minha vaga</button></div>'
    + '</div>';
  document.body.appendChild(bg);
  const cnCpfInput = bg.querySelector('#cn-cpf');
  cnCpfInput.oninput = ()=>{ cnCpfInput.value = maskCpf(cnCpfInput.value); };
  bg.querySelector('#cn-cancel').onclick = ()=> bg.remove();
  bg.querySelector('#cn-confirm').onclick = ()=>{
    const nome = bg.querySelector('#cn-nome').value.trim();
    const cpfDigits = cnCpfInput.value.replace(/\D/g,'');
    if(!nome){ showToast('Digite seu nome'); return; }
    if(cpfDigits.length !== 11){ showToast('Digite um CPF válido'); return; }
    const match = signupsFor(shiftId).find(x=>x.nome.toLowerCase()===nome.toLowerCase());
    if(!match){ showToast('Nome não encontrado nesta vaga'); return; }
    const matchCpfDigits = (match.cpf||'').replace(/\D/g,'');
    if(matchCpfDigits !== cpfDigits){ showToast('CPF não confere com o cadastro desta vaga'); return; }
    const removedId = match.id;
    signups = signups.filter(x=>x.id!==removedId);
    bg.remove();
    showToast('Voluntariado cancelado');
    render();
    persistSignupDelete(removedId);
  };
}

function removeSignup(id){
  signups = signups.filter(x=>x.id!==id);
  render();
  showToast('Removido');
  persistSignupDelete(id);
}

function setFase(shiftId, novaFase){
  const s = shifts.find(x=>x.id===shiftId);
  if(!s || s.fase === novaFase) return;
  s.fase = novaFase;
  showToast('Fase alterada: '+faseLabel(novaFase));
  render();
  persistShiftUpsert(s);
}

function faseQuickButtonsHtml(s){
  return '<div style="display:flex;gap:4px;">' + FASE_OPTIONS.map(o=>{
    const active = s.fase === o.v;
    const shortLabel = o.v==='soldado' ? 'Sd' : (o.v==='todos' ? 'Todos' : (o.v==='sgt' ? 'Sgt' : 'Cabo'));
    return '<button class="btn '+(active?'btn-blue':'btn-ghost')+' btn-sm" '+(active?'disabled':'')+' onclick="setFase(\''+s.id+'\',\''+o.v+'\')">'+shortLabel+'</button>';
  }).join('') + '</div>';
}

    const atual = bg.querySelector('#cp-atual').value.trim();
    const novo = bg.querySelector('#cp-novo').value.trim();
    const confirma = bg.querySelector('#cp-confirma').value.trim();
    if(atual !== currentPin){ showToast('PIN atual incorreto'); return; }

    persist({ pin: novo });
  };
}

// ---------- IMPORTAÇÃO DA ESCALA MENSAL (PDF de equipes + calendário em DOCX/XLSX/ODS/CSV) ----------

function getFileExt(filename){
  const m = (filename||'').toLowerCase().match(/\.([a-z0-9]+)$/);
  return m ? m[1] : '';
}

async function processImportFiles(){
  const equipesInput = document.getElementById('imp-equipes');
  const calInput = document.getElementById('imp-calendario');
  const equipesFile = equipesInput && equipesInput.files[0];
  const calFile = calInput && calInput.files[0];
  if(!equipesFile || !calFile){ showToast('Selecione o arquivo de escala de equipes e o de calendário antes de processar'); return; }

  const equipesExt = getFileExt(equipesFile.name);
  if(!['pdf','docx','xlsx','ods','csv'].includes(equipesExt)){ showToast('Formato de escala de equipes não suportado. Use PDF, DOCX, XLSX, ODS ou CSV.'); return; }
  if(equipesExt === 'pdf' && !window.pdfjsLib){ showToast('Biblioteca de leitura de PDF não carregou. Verifique sua conexão e recarregue a página.'); return; }
  if(equipesExt === 'docx' && !window.mammoth){ showToast('Biblioteca de leitura de DOCX não carregou. Verifique sua conexão e recarregue a página.'); return; }
  if(['xlsx','ods','csv'].includes(equipesExt) && !window.XLSX){ showToast('Biblioteca de leitura de planilhas não carregou. Verifique sua conexão e recarregue a página.'); return; }

  const calExt = getFileExt(calFile.name);
  if(!['docx','xlsx','ods','csv'].includes(calExt)){ showToast('Formato de calendário não suportado. Use DOCX, XLSX, ODS ou CSV.'); return; }
  if(calExt === 'docx' && !window.mammoth){ showToast('Biblioteca de leitura de DOCX não carregou. Verifique sua conexão e recarregue a página.'); return; }
  if(calExt !== 'docx' && !window.XLSX){ showToast('Biblioteca de leitura de planilhas não carregou. Verifique sua conexão e recarregue a página.'); return; }

  const btn = document.getElementById('imp-process');
  if(btn){ btn.disabled = true; btn.textContent = 'Processando...'; }
  try{
    const [teams, calendarResult] = await Promise.all([
      parseEquipesFile(equipesFile),
      parseCalendarioFile(calFile)
    ]);
    openImportPreviewModal(teams, calendarResult.calendar, calendarResult.usedFallback);
  }catch(e){
    console.error(e);
    showToast('Erro ao processar os arquivos: '+(e && e.message ? e.message : 'formato inesperado'));
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = 'Processar arquivos'; }
  }
}

// Detecta o formato do arquivo de escala de equipes pela extensão e direciona
// ao parser correto. Todos devolvem o mesmo formato de saída: { A:[...], B:[...], C:[...], D:[...] }.
async function parseEquipesFile(file){
  const ext = getFileExt(file.name);
  if(ext === 'pdf') return parseEquipesPdf(file);
  if(ext === 'docx') return parseEquipesDocx(file);
  if(ext === 'xlsx' || ext === 'ods' || ext === 'csv') return parseEquipesSpreadsheet(file);
  throw new Error('Formato de escala de equipes não suportado (.'+(ext||'?')+'). Use PDF, DOCX, XLSX, ODS ou CSV.');
}

// Detecta o formato do arquivo de calendário pela extensão e direciona ao
// parser correto. Os dois parsers (DOCX e planilha) sempre devolvem o mesmo
// formato de saída: { calendar, usedFallback }.
async function parseCalendarioFile(file){
  const ext = getFileExt(file.name);
  if(ext === 'docx') return parseCalendarioDocx(file);
  if(ext === 'xlsx' || ext === 'ods' || ext === 'csv') return parseCalendarioSpreadsheet(file);
  throw new Error('Formato de calendário não suportado (.'+(ext||'?')+'). Use DOCX, XLSX, ODS ou CSV.');
}

// --- PDF (escala de equipes) ---

async function parseEquipesPdf(file){
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
  const lines = [];
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    let lastY = null, cur = '';
    for(const item of content.items){
      const y = item.transform[5];
      if(lastY !== null && Math.abs(y-lastY) > 2){
        if(cur.trim()) lines.push(cur.trim());
        cur = '';
      }
      cur += item.str + ' ';
      lastY = y;
    }
    if(cur.trim()) lines.push(cur.trim());
  }
  return parseEquipesFromLines(lines);
}

// Um registro no PDF tem o formato "Função - Patente. QP PM Nome, CPF XXX.XXX.XXX-XX",
// mas a extração de texto do PDF pode quebrar isso em várias "linhas" — por isso
// concatenamos linhas num buffer até encontrar um CPF completo.
const CPF_COMPLETE_RE = /CPF[:\s]*([0-9Xx]{3}\.[0-9Xx]{3}\.[0-9Xx]{3}-[0-9Xx]{2})/i;
const REGISTRO_RE = /-\s*([^.]+?)\.\s*QP\s*PM\s*([^,]+?),\s*CPF[:\s]*([0-9Xx]{3}\.[0-9Xx]{3}\.[0-9Xx]{3}-[0-9Xx]{2})/i;

function parseEquipesFromLines(lines){
  const teams = { A:[], B:[], C:[], D:[] };
  let currentTeam = null;
  let buffer = '';
  const flushBuffer = ()=>{
    if(!currentTeam || !buffer.trim()){ buffer=''; return; }
    const m = buffer.match(REGISTRO_RE);
    if(m){
      const cpf = m[3].trim().toUpperCase();
      teams[currentTeam].push({ nome: m[2].trim(), patente: m[1].trim(), cpf, cpfSuspeito: !isValidCpfShape(cpf) });
    } else {
      const cpfLoose = buffer.match(CPF_COMPLETE_RE);
      teams[currentTeam].push({
        nome: buffer.replace(CPF_COMPLETE_RE,'').replace(/QP\s*PM/i,'').trim().slice(0,80),
        patente: '',
        cpf: cpfLoose ? cpfLoose[1].toUpperCase() : '',
        cpfSuspeito: true
      });
    }
    buffer = '';
  };
  for(const raw of lines){
    const line = raw.trim();
    if(!line) continue;
    const teamMatch = line.match(/EQUIPE\s*([A-D])\b/i);
    if(teamMatch){
      flushBuffer();
      currentTeam = teamMatch[1].toUpperCase();
      continue;
    }
    if(!currentTeam) continue; // texto antes da primeira "Equipe X" (cabeçalho do documento) é ignorado
    buffer += (buffer ? ' ' : '') + line;
    if(CPF_COMPLETE_RE.test(buffer)) flushBuffer();
  }
  flushBuffer();
  return teams;
}

// --- DOCX (escala de equipes) ---
// Extrai texto simples do documento (sem tabela) e reaproveita o mesmo
// parser de linhas usado no PDF, já que o formato do registro é o mesmo texto
// corrido ("Equipe X" seguido de "Função - Patente. QP PM Nome, CPF ...").
async function parseEquipesDocx(file){
  const buf = await file.arrayBuffer();
  const result = await window.mammoth.extractRawText({ arrayBuffer: buf });
  const lines = result.value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  return parseEquipesFromLines(lines);
}

// --- Planilha (escala de equipes: XLSX / ODS / CSV) ---
// Aceita dois formatos: (1) estruturado, com colunas de cabeçalho
// Equipe/Patente/Nome/CPF (em qualquer ordem/posição, em qualquer aba); ou
// (2) texto corrido nas células, reaproveitando o mesmo parser de linhas do
// PDF/DOCX (concatena as células de cada linha da planilha como se fossem
// uma linha de texto extraída do documento).
function tryParseStructuredEquipesRows(rows){
  let headerRowIdx = -1, colMap = null;
  for(let r=0; r<Math.min(rows.length, 30); r++){
    const row = rows[r] || [];
    const map = {};
    row.forEach((cell, c)=>{
      const t = String(cell==null?'':cell).trim().toUpperCase();
      if(/^EQUIPE/.test(t)) map.equipe = c;
      else if(/^PATENTE/.test(t)) map.patente = c;
      else if(/^NOME/.test(t)) map.nome = c;
      else if(/^CPF/.test(t)) map.cpf = c;
    });
    if(map.equipe!=null && map.nome!=null && map.cpf!=null){ headerRowIdx = r; colMap = map; break; }
  }
  if(headerRowIdx === -1) return null;

  const teams = { A:[], B:[], C:[], D:[] };
  for(let r=headerRowIdx+1; r<rows.length; r++){
    const row = rows[r] || [];
    const equipeRaw = colMap.equipe!=null ? String(row[colMap.equipe]==null?'':row[colMap.equipe]).trim().toUpperCase() : '';
    const equipeMatch = equipeRaw.match(/([A-D])/);
    if(!equipeMatch) continue;
    const letter = equipeMatch[1];
    const nome = colMap.nome!=null ? String(row[colMap.nome]==null?'':row[colMap.nome]).trim() : '';
    const patente = colMap.patente!=null ? String(row[colMap.patente]==null?'':row[colMap.patente]).trim() : '';
    const cpf = colMap.cpf!=null ? String(row[colMap.cpf]==null?'':row[colMap.cpf]).trim().toUpperCase() : '';
    if(!nome && !cpf) continue;
    teams[letter].push({ nome, patente, cpf, cpfSuspeito: !isValidCpfShape(cpf) });
  }
  return teams;
}

async function parseEquipesSpreadsheet(file){
  const ext = getFileExt(file.name);
  let workbook;
  if(ext === 'csv'){
    const text = await file.text();
    workbook = window.XLSX.read(text, { type: 'string' });
  } else {
    const buf = await file.arrayBuffer();
    workbook = window.XLSX.read(new Uint8Array(buf), { type: 'array' });
  }

  for(const sheetName of workbook.SheetNames){
    const sheet = workbook.Sheets[sheetName];
    const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
    const structured = tryParseStructuredEquipesRows(rows);
    if(structured) return structured;
  }

  // Nenhuma aba tinha cabeçalho estruturado reconhecível: trata cada linha
  // da planilha como texto corrido e reaproveita o parser de linhas do PDF.
  const lines = [];
  for(const sheetName of workbook.SheetNames){
    const sheet = workbook.Sheets[sheetName];
    const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
    for(const row of rows){
      const text = (row||[]).map(c=> String(c==null?'':c).trim()).filter(Boolean).join(' ');
      if(text) lines.push(text);
    }
  }
  return parseEquipesFromLines(lines);
}

// --- DOCX (calendário mensal) ---

const MESES_PT = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];

async function parseCalendarioDocx(file){
  const buf = await file.arrayBuffer();
  const result = await window.mammoth.convertToHtml({ arrayBuffer: buf });
  const container = document.createElement('div');
  container.innerHTML = result.value;

  const tables = Array.from(container.querySelectorAll('table'));
  if(tables.length === 0) throw new Error('Nenhuma tabela encontrada no documento DOCX');

  const headingFor = (table)=>{
    let node = table.previousElementSibling;
    let hops = 0;
    while(node && hops < 6){
      const t = (node.textContent||'').trim();
      if(t) return t.toUpperCase();
      node = node.previousElementSibling;
      hops++;
    }
    return '';
  };

  const today = new Date();
  const currentMonthName = MESES_PT[today.getMonth()];
  const currentYear = String(today.getFullYear());

  let targetTable = tables[0];
  let usedFallback = tables.length > 1;
  if(tables.length > 1){
    for(const t of tables){
      const heading = headingFor(t);
      if(heading.includes(currentMonthName) && heading.includes(currentYear)){
        targetTable = t; usedFallback = false; break;
      }
    }
  }

  const heading = headingFor(targetTable);
  const yearMatch = heading.match(/(\d{4})/);
  const year = yearMatch ? parseInt(yearMatch[1],10) : today.getFullYear();

  const calendar = {};
  const rows = Array.from(targetTable.querySelectorAll('tr'));
  for(const row of rows){
    const cells = Array.from(row.querySelectorAll('td,th')).map(c=>(c.textContent||'').trim());
    if(cells.length < 4) continue;
    const dm = cells[0].match(/^(\d{1,2})\/(\d{1,2})/);
    if(!dm) continue; // linha de cabeçalho ou vazia
    const dateStr = year+'-'+dm[2].padStart(2,'0')+'-'+dm[1].padStart(2,'0');
    calendar[dateStr] = { dia: (cells[2]||'').toUpperCase(), noite: (cells[3]||'').toUpperCase() };
  }

  return { calendar, usedFallback };
}

// --- Planilha (XLSX / ODS / CSV) ---

// Converte uma célula de data em {day, month}, aceitando tanto texto "dd/mm"
// quanto data serializada do Excel/ODS (célula formatada como data).
function excelCellToDayMonth(val){
  if(val instanceof Date && !isNaN(val)){
    // A SheetJS (cellDates:true) cria o Date de uma célula de data ancorado em
    // UTC meia-noite (Date.UTC internamente). Ler com getDate()/getMonth()
    // (getters em fuso LOCAL) faz o dia "voltar" em fusos atrás de UTC (ex:
    // Brasil, UTC-3) — 01/08 UTC vira 31/07 23:59 no navegador. Por isso
    // usamos os getters UTC, que refletem o dia/mês exatamente como estavam
    // na planilha, sem depender do fuso horário do navegador.
    return { day: val.getUTCDate(), month: val.getUTCMonth()+1 };
  }
  if(typeof val === 'number' && window.XLSX && window.XLSX.SSF){
    try{
      const parsed = window.XLSX.SSF.parse_date_code(val);
      if(parsed) return { day: parsed.d, month: parsed.m };
    }catch(e){}
  }
  const s = String(val==null ? '' : val).trim();
  const m = s.match(/^(\d{1,2})\/(\d{1,2})/);
  if(m) return { day: parseInt(m[1],10), month: parseInt(m[2],10) };
  return null;
}

// A planilha pode ter várias abas (uma por mês) e, dentro de uma aba, duas
// tabelas lado a lado (RPA/COPOM e DPM, separadas por uma coluna em branco).
// Localizamos todas as células de título "RPA/COPOM" (a tabela DPM é
// ignorada por não ter turno Noite estruturado) em todas as abas, escolhemos
// a que bate com o mês/ano atual (mesma lógica usada no DOCX) e extraímos os
// dados a partir da linha de cabeçalho "Data" logo abaixo do título.
async function parseCalendarioSpreadsheet(file){
  const ext = getFileExt(file.name);
  let workbook;
  if(ext === 'csv'){
    const text = await file.text();
    workbook = window.XLSX.read(text, { type: 'string' });
  } else {
    const buf = await file.arrayBuffer();
    workbook = window.XLSX.read(new Uint8Array(buf), { type: 'array', cellDates: true });
  }

  const today = new Date();
  const currentMonthName = MESES_PT[today.getMonth()];
  const currentYear = String(today.getFullYear());

  const candidates = [];
  for(const sheetName of workbook.SheetNames){
    const sheet = workbook.Sheets[sheetName];
    const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: '' });
    for(let r=0; r<rows.length; r++){
      const row = rows[r] || [];
      for(let c=0; c<row.length; c++){
        const text = (row[c]==null ? '' : String(row[c])).toUpperCase();
        if(/RPA/.test(text) && /COPOM/.test(text)){
          candidates.push({ sheetName, rows, row: r, col: c, titleText: text });
        }
      }
    }
  }
  if(candidates.length === 0) throw new Error('Nenhuma tabela "Equipes RPA/COPOM" encontrada na planilha');

  let chosen = candidates[0];
  let usedFallback = candidates.length > 1;
  if(candidates.length > 1){
    const match = candidates.find(c=> c.titleText.includes(currentMonthName) && c.titleText.includes(currentYear));
    if(match){ chosen = match; usedFallback = false; }
  }

  const yearMatch = chosen.titleText.match(/(\d{4})/);
  const year = yearMatch ? parseInt(yearMatch[1],10) : today.getFullYear();

  // Localiza a linha de cabeçalho ("Data") logo abaixo do título, na mesma coluna.
  const rows = chosen.rows;
  let headerRow = -1;
  for(let r = chosen.row+1; r < Math.min(chosen.row+5, rows.length); r++){
    const cell = rows[r] && rows[r][chosen.col];
    if(cell!=null && /^DATA$/i.test(String(cell).trim())){ headerRow = r; break; }
  }
  if(headerRow === -1) throw new Error('Não foi possível localizar o cabeçalho da tabela RPA/COPOM (linha "Data")');

  // Ordem de colunas a partir do título, conforme o padrão da planilha:
  // Data, Dia semana, Dia, Noite, Descanso(24h), Folga(48h).
  const dataCol = chosen.col, diaCol = chosen.col+2, noiteCol = chosen.col+3;
  const calendar = {};
  for(let r = headerRow+1; r < rows.length; r++){
    const row = rows[r] || [];
    const dm = excelCellToDayMonth(row[dataCol]);
    if(!dm){
      const next = rows[r+1] || [];
      if(!excelCellToDayMonth(next[dataCol])) break; // duas linhas em branco seguidas = fim da tabela
      continue;
    }
    const dateStr = year+'-'+String(dm.month).padStart(2,'0')+'-'+String(dm.day).padStart(2,'0');
    const dia = row[diaCol]!=null ? String(row[diaCol]).trim().toUpperCase() : '';
    const noite = row[noiteCol]!=null ? String(row[noiteCol]).trim().toUpperCase() : '';
    calendar[dateStr] = { dia, noite };
  }

  return { calendar, usedFallback };
}

// --- Tela de prévia/conferência ---

function buildImportMemberRowHtml(letter, idx, m){
  m = m || {};
  return '<div data-imp-row style="margin-bottom:4px;">'
    + '<div class="row3" style="align-items:center;">'
    + '<input data-imp-team="'+letter+'" data-imp-idx="'+idx+'" data-imp-field="patente" value="'+escapeHtml(m.patente||'')+'" placeholder="Patente">'
    + '<input data-imp-team="'+letter+'" data-imp-idx="'+idx+'" data-imp-field="nome" value="'+escapeHtml(m.nome||'')+'" placeholder="Nome">'
    + '<div style="display:flex;gap:4px;align-items:center;">'
    + '<input data-imp-team="'+letter+'" data-imp-idx="'+idx+'" data-imp-field="cpf" value="'+escapeHtml(m.cpf||'')+'" placeholder="000.000.000-00" style="flex:1;min-width:0;'+(m.cpfSuspeito?'border-color:var(--red);':'')+'">'
    + '<button type="button" class="link-btn" style="color:var(--red);flex-shrink:0;" onclick="removeImportMember(this)" title="Remover policial">✕</button>'
    + '</div>'
    + '</div>'
    + (m.cpfSuspeito ? '<div class="muted-sm" style="color:var(--red);margin:2px 0 6px;">CPF fora do padrão esperado — confira manualmente.</div>' : '')
    + '</div>';
}

function buildTeamSectionHtml(letter, members){
  let rowsHtml = '';
  if(members.length === 0){
    rowsHtml = '<div class="muted-sm" data-imp-empty>Nenhum policial identificado para esta equipe.</div>';
  } else {
    members.forEach((m, idx)=>{ rowsHtml += buildImportMemberRowHtml(letter, idx, m); });
  }
  return '<div style="margin-bottom:16px;" data-imp-team-section="'+letter+'">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">'
    + '<span style="font-family:\'Oswald\',sans-serif;text-transform:uppercase;font-size:13px;color:var(--amber);" data-imp-team-title>Equipe '+letter+' ('+members.length+')</span>'
    + '<button type="button" class="btn btn-ghost btn-sm" onclick="addImportMember(\''+letter+'\')" title="Adicionar policial">+</button>'
    + '</div>'
    + '<div data-imp-rows>'+rowsHtml+'</div>'
    + '</div>';
}

let impNextRowIdx = 1000000; // base alto pra nunca colidir com os índices originais (0..n-1) dos membros já existentes

function addImportMember(letter){
  const section = document.querySelector('[data-imp-team-section="'+letter+'"]');
  if(!section) return;
  const rowsContainer = section.querySelector('[data-imp-rows]');
  const emptyMsg = rowsContainer.querySelector('[data-imp-empty]');
  if(emptyMsg) emptyMsg.remove();
  const wrapper = document.createElement('div');
  wrapper.innerHTML = buildImportMemberRowHtml(letter, impNextRowIdx++, {});
  rowsContainer.appendChild(wrapper.firstChild);
  updateImportTeamCount(section, letter);
}

function removeImportMember(btn){
  const row = btn.closest('[data-imp-row]');
  const section = row.closest('[data-imp-team-section]');
  const letter = section.getAttribute('data-imp-team-section');
  row.remove();
  const rowsContainer = section.querySelector('[data-imp-rows]');
  if(rowsContainer.children.length === 0){
    rowsContainer.innerHTML = '<div class="muted-sm" data-imp-empty>Nenhum policial identificado para esta equipe.</div>';
  }
  updateImportTeamCount(section, letter);
}

function updateImportTeamCount(section, letter){
  const title = section.querySelector('[data-imp-team-title]');
  const count = section.querySelectorAll('[data-imp-row]').length;
  if(title) title.textContent = 'Equipe '+letter+' ('+count+')';
}

function buildCalendarSectionHtml(calendar){
  const dates = Object.keys(calendar).sort();
  let html = '<div style="font-family:\'Oswald\',sans-serif;text-transform:uppercase;font-size:13px;color:var(--amber);margin:16px 0 8px;">Calendário ('+dates.length+' dia(s))</div>';
  if(dates.length === 0){
    html += '<div class="muted-sm">Nenhum dia identificado no calendário.</div>';
  } else {
    html += '<div class="table-wrap"><table class="roster"><thead><tr><th>Data</th><th>Dia</th><th>Noite</th></tr></thead><tbody>';
    dates.forEach(dateStr=>{
      const entry = calendar[dateStr];
      const dp = fmtDateParts(dateStr);
      html += '<tr><td>'+dp.dnum+'/'+dp.mon+'</td>'
        + '<td><input data-imp-cal-date="'+dateStr+'" data-imp-cal-field="dia" value="'+escapeHtml(entry.dia||'')+'" style="max-width:56px;"></td>'
        + '<td><input data-imp-cal-date="'+dateStr+'" data-imp-cal-field="noite" value="'+escapeHtml(entry.noite||'')+'" style="max-width:56px;"></td></tr>';
    });
    html += '</tbody></table></div>';
  }
  return html;
}

function openImportPreviewModal(teams, calendar, calendarFallback){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  let inner = '<div class="modal" style="max-width:640px;">'
    + '<h3>Conferir escala importada</h3>'
    + '<div class="muted-sm" style="margin-bottom:12px;">Revise os campos abaixo — a extração automática pode errar. Corrija o que precisar antes de salvar.</div>';
  if(calendarFallback){
    inner += '<div class="muted-sm" style="color:var(--red);margin-bottom:10px;">Não encontramos uma tabela para o mês/ano atual no DOCX — usando a primeira tabela do documento. Confira as datas com atenção.</div>';
  }
  TEAM_LETTERS.forEach(letter=>{ inner += buildTeamSectionHtml(letter, teams[letter] || []); });
  inner += buildCalendarSectionHtml(calendar);
  inner += '<div class="modal-actions"><button class="btn btn-ghost" id="imp-cancel">Cancelar</button><button class="btn btn-primary" id="imp-confirm">Confirmar e salvar</button></div>'
    + '</div>';
  bg.innerHTML = inner;
  document.body.appendChild(bg);
  bg.querySelector('#imp-cancel').onclick = ()=> bg.remove();
  bg.querySelector('#imp-confirm').onclick = ()=>{
    const finalTeams = { A:[], B:[], C:[], D:[] };
    bg.querySelectorAll('[data-imp-team]').forEach(input=>{
      const letter = input.getAttribute('data-imp-team');
      const idx = parseInt(input.getAttribute('data-imp-idx'), 10);
      const field = input.getAttribute('data-imp-field');
      if(!finalTeams[letter][idx]) finalTeams[letter][idx] = { nome:'', patente:'', cpf:'' };
      finalTeams[letter][idx][field] = input.value.trim();
    });
    TEAM_LETTERS.forEach(letter=>{ finalTeams[letter] = finalTeams[letter].filter(m=> m && (m.nome || m.cpf)); });

    const finalCalendar = {};
    bg.querySelectorAll('[data-imp-cal-date]').forEach(input=>{
      const dateStr = input.getAttribute('data-imp-cal-date');
      const field = input.getAttribute('data-imp-cal-field');
      if(!finalCalendar[dateStr]) finalCalendar[dateStr] = { dia:'', noite:'' };
      finalCalendar[dateStr][field] = input.value.trim().toUpperCase();
    });

    escalaOficial = finalTeams;
    calendarioOficial = finalCalendar;
    importFormOpen = false;
    bg.remove();
    showToast('Escala oficial importada e salva');
    render();
    persist({ escalaOficial: finalTeams, calendarioOficial: finalCalendar });
  };
}

// ---------- EXPORTAÇÃO DA ESCALA (XLSX) ----------

function exportEscalaXlsx(){
  if(!window.XLSX){ showToast('Biblioteca de planilhas não carregou. Recarregue a página.'); return; }

  const today = new Date(); today.setHours(0,0,0,0);
  const upcoming = shifts
    .filter(s=>{ const [y,m,d]=s.date.split('-').map(Number); return new Date(y,m-1,d) >= today; })
    .slice()
    .sort((a,b)=> (a.date+a.startTime).localeCompare(b.date+b.startTime));

  const headers = ['Data','Dia da semana','Horário','Local','Viatura','Liberado para','Nome do voluntário','Patente'];
  const rows = [headers];
  const merges = [];
  const vagaBlocks = []; // {startRow,endRow} de cada vaga — usado pra cor alternada
  const MERGE_COLS = [0,1,2,3,4,5]; // Data..Liberado para (Nome/Patente ficam por linha)

  upcoming.forEach((s, vagaIdx)=>{
    const dp = fmtDateParts(s.date);
    const [y,m,d] = s.date.split('-');
    const dataFmt = d+'/'+m+'/'+y;
    const horario = s.startTime+'–'+s.endTime;
    const su = signupsFor(s.id);
    const startRow = rows.length;

    if(su.length === 0){
      rows.push([dataFmt, dp.dow, horario, s.local||'', s.viatura||'', faseLabel(s.fase), '', '']);
    } else {
      su.forEach((x, i)=>{
        // Só a primeira linha do bloco leva os dados da vaga — as demais
        // ficam com essas colunas vazias, pois serão cobertas pela célula
        // mesclada (!merges) logo abaixo.
        rows.push(i===0
          ? [dataFmt, dp.dow, horario, s.local||'', s.viatura||'', faseLabel(s.fase), x.nome, RANK_LABEL[x.patente]||x.patente||'']
          : ['', '', '', '', '', '', x.nome, RANK_LABEL[x.patente]||x.patente||'']);
      });
    }

    const endRow = rows.length - 1;
    vagaBlocks.push({ startRow, endRow });
    if(su.length > 1){
      MERGE_COLS.forEach(c=>{ merges.push({ s:{r:startRow,c}, e:{r:endRow,c} }); });
    }

    // Linha em branco entre uma vaga e a próxima, pra separar visualmente
    // (ver nota sobre cor de fundo mais abaixo).
    if(vagaIdx < upcoming.length - 1){
      rows.push(['', '', '', '', '', '', '', '']);
    }
  });

  const ws = window.XLSX.utils.aoa_to_sheet(rows);
  // Largura de coluna aproximada (em "caracteres"), suportada na versão
  // gratuita da SheetJS. Negrito no cabeçalho exigiria estilo de célula
  // (propriedade .s), que não é suportado na build community/gratuita do
  // XLSX usada aqui — por isso o cabeçalho fica só como texto normal mesmo.
  ws['!cols'] = [
    { wch: 12 }, // Data
    { wch: 14 }, // Dia da semana
    { wch: 14 }, // Horário
    { wch: 24 }, // Local
    { wch: 10 }, // Viatura
    { wch: 26 }, // Liberado para
    { wch: 26 }, // Nome do voluntário
    { wch: 12 }, // Patente
  ];

  // Mescla verticalmente Data/Dia da semana/Horário/Local/Viatura/Liberado
  // para ao longo das linhas de voluntários de cada vaga com mais de um
  // voluntário. Nome e Patente permanecem distintos por linha.
  ws['!merges'] = merges;

  // Cabeçalho fixo ao rolar (freeze panes). Formato conforme a documentação
  // da SheetJS; a build gratuita/community carregada aqui (xlsx.full.min.js)
  // costuma IGNORAR essa propriedade silenciosamente ao gravar o .xlsx —
  // congelar painel é normalmente um recurso restrito à versão Pro. Deixamos
  // a tentativa mesmo assim (sem custo caso seja ignorada pela build atual).
  ws['!freeze'] = { xSplit: 0, ySplit: 1, topLeftCell: 'A2', activePane: 'bottomLeft', state: 'frozen' };

  // Autofiltro no intervalo completo da tabela — isso É suportado ao gravar
  // na versão gratuita da SheetJS (não depende de estilo de célula).
  const lastRow = rows.length - 1;
  const lastCol = headers.length - 1;
  ws['!autofilter'] = { ref: window.XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:lastRow,c:lastCol} }) };

  // Cor de fundo alternada por vaga via estilo de célula (cell.s). Mesma
  // ressalva do negrito/freeze: a versão gratuita da SheetJS não grava
  // estilos de célula no .xlsx (recurso Pro), então isso tende a não
  // aparecer nesta build — por isso a linha em branco entre vagas (acima) é
  // o mecanismo que garante, de fato, a separação visual aqui.
  vagaBlocks.forEach((block, idx)=>{
    if(idx % 2 === 0) return; // pinta uma vaga sim, uma não
    for(let r=block.startRow; r<=block.endRow; r++){
      for(let c=0; c<headers.length; c++){
        const addr = window.XLSX.utils.encode_cell({ r, c });
        if(!ws[addr]) ws[addr] = { t:'s', v:'' };
        ws[addr].s = { fill: { fgColor: { rgb:'F2F2F2' } }, border: {
          top: { style:'thin', color:{ rgb:'CCCCCC' } }, bottom: { style:'thin', color:{ rgb:'CCCCCC' } },
          left: { style:'thin', color:{ rgb:'CCCCCC' } }, right: { style:'thin', color:{ rgb:'CCCCCC' } }
        } };
      }
    }
  });

  const wb = window.XLSX.utils.book_new();
  window.XLSX.utils.book_append_sheet(wb, ws, 'Escala Extra');

  const todayStr = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  window.XLSX.writeFile(wb, 'escala-extra-'+todayStr+'.xlsx');
}

function deleteShift(id){
  if(!confirm('Excluir esta vaga? Os voluntários cadastrados nela também serão removidos.')) return;
  const cascadeIds = signups.filter(s=>s.shiftId===id).map(s=>s.id);
  shifts = shifts.filter(s=>s.id!==id);
  signups = signups.filter(s=>s.shiftId!==id);
  showToast('Vaga excluída');
  render();
  persistShiftDelete(id, cascadeIds);
}

function loadDemoData(){
  if(!confirm('Isso vai adicionar vagas e voluntários de exemplo para você visualizar. Continuar?')) return;
  const today = new Date();
  const d1 = new Date(today); d1.setDate(d1.getDate()+3);
  const d2 = new Date(today); d2.setDate(d2.getDate()+5);
  const d3 = new Date(today); d3.setDate(d3.getDate()+7);
  // Monta 'YYYY-MM-DD' a partir dos getters locais (mesmo padrão usado em
  // shiftDateStr/fmtDateParts) em vez de toISOString(), que converte para UTC
  // e pode voltar a data em 1 dia em fusos atrás de UTC (ex: Brasil, UTC-3).
  const fmt = (d)=> d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const s1 = { id: uid(), date: fmt(d1), startTime:'08:00', endTime:'14:00', local:'Batalhão Central', viatura:'1204', vagas:3, fase:'cabo' };
  const s2 = { id: uid(), date: fmt(d2), startTime:'19:00', endTime:'23:00', local:'Evento - Estádio', viatura:'0817', vagas:2, fase:'soldado' };
  const s3 = { id: uid(), date: fmt(d3), startTime:'06:00', endTime:'12:00', local:'Operação Rodovia', viatura:'', vagas:4, fase:'sgt' };
  shifts.push(s1, s2, s3);
  sortShifts();
  const demoSignups = [
    { id: uid(), shiftId: s1.id, nome: '3º Sgt Carvalho', patente:'sgt', timestamp: new Date().toISOString() },
    { id: uid(), shiftId: s1.id, nome: 'Cb Ferreira', patente:'cabo', timestamp: new Date().toISOString() },
    { id: uid(), shiftId: s2.id, nome: 'Sd Almeida', patente:'soldado', timestamp: new Date().toISOString() },
    { id: uid(), shiftId: s2.id, nome: 'Sd Rocha', patente:'soldado', timestamp: new Date().toISOString() },
    { id: uid(), shiftId: s3.id, nome: '2º Sgt Barros', patente:'sgt', timestamp: new Date().toISOString() },
  ];
  signups.push(...demoSignups);
  showToast('Exemplo carregado');
  render();
  persistBulkUpsert([s1, s2, s3], demoSignups);
}

let unsubscribeRealtime = null;

function attachRealtimeListener(){
  if(unsubscribeRealtime) return; // já anexado — nunca duplica o listener
  unsubscribeRealtime = onSnapshot(docRef, (snap)=>{
    try{
      if(!snap.exists()){
        setDoc(docRef, { pin: null, shifts: {}, signups: {} }, { merge: true }).catch(e=>console.error(e));
        return; // o próprio setDoc acima vai disparar este listener de novo
      }
      applyRemoteData(snap.data());
      render();
    }catch(e){
      console.error('Erro ao processar atualização em tempo real:', e);
    }
  }, (err)=>{
    console.error('Erro no listener em tempo real:', err);
    showToast('Erro de sincronização em tempo real');
  });
}

  attachRealtimeListener();
