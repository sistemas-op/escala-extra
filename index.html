// ---------- EXPORTAÇÃO DA ESCALA (modelo oficial — XLSX e DOCX) ----------

const ESCALA_REPORT_TITLE = 'ESCALA EXTRAJORNADA VOLUNTÁRIA – 1ª CIA/16º BPM';
const ESCALA_REPORT_HEADERS = ['CIDADE', 'DIA E HORÁRIO', 'VTR - Setor', 'PMs ESCALADO'];

// Monta, por vaga futura ("upcoming": data >= hoje), os dados já no formato
// do modelo oficial. Cada bloco vira 1+ linhas na tabela final: uma linha por
// voluntário (mínimo 1, mesmo sem voluntário nenhum, pra vaga aparecer vazia),
// com Cidade/Dia e Horário/VTR-Setor repetidos apenas na 1ª linha do bloco —
// as demais colunas dessas ficam mescladas verticalmente por quem consome
// este array (ver exportEscalaXlsx/exportEscalaDocx).
function buildEscalaReportBlocks(){
  const today = new Date(); today.setHours(0,0,0,0);
  const upcoming = shifts
    .filter(s=>{ const p=parseDateStr(s && s.date); return p ? new Date(p.y,p.m-1,p.d) >= today : false; })
    .slice()
    .sort((a,b)=> (a.date+a.startTime).localeCompare(b.date+b.startTime));

  return upcoming.map(s=>{
    const [y,m,d] = s.date.split('-');
    const dataFmt = d+'/'+m+'/'+y;
    const diaHorario = dataFmt+', '+s.startTime+'–'+s.endTime;
    const su = signupsFor(s.id);
    const pmLines = su.length
      ? su.map(x=> ((RANK_ABBR[x.patente]||'')+' '+(x.nome||'')).trim())
      : [''];
    return { cidade: 'Guarapuava', diaHorario, vtrSetor: s.local||'', pmLines };
  });
}

function exportEscalaXlsx(){
  if(!window.XLSX){ showToast('Biblioteca de planilhas não carregou. Recarregue a página.'); return; }

  const blocks = buildEscalaReportBlocks();
  const rows = [];
  const merges = [];

  // Linha 0: título mesclado nas 4 colunas.
  rows.push([ESCALA_REPORT_TITLE, '', '', '']);
  merges.push({ s:{r:0,c:0}, e:{r:0,c:3} });

  // Linha 1: cabeçalho da tabela.
  rows.push(ESCALA_REPORT_HEADERS.slice());
  const headerRow = 1;

  blocks.forEach(b=>{
    const startRow = rows.length;
    b.pmLines.forEach((line, i)=>{
      rows.push(i===0 ? [b.cidade, b.diaHorario, b.vtrSetor, line] : ['', '', '', line]);
    });
    const endRow = rows.length - 1;
    // Cidade/Dia e Horário/VTR-Setor mesclados verticalmente quando a vaga
    // tem mais de um voluntário — PMs ESCALADO fica uma linha por voluntário.
    if(b.pmLines.length > 1){
      [0,1,2].forEach(c=> merges.push({ s:{r:startRow,c}, e:{r:endRow,c} }));
    }
  });

  rows.push(['', '', '', '']);
  rows.push(['Assinado no Original', '', '', '']);
  rows.push(['', '', '', '']);
  rows.push(['___________________________', '', '', '']);

  const ws = window.XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [
    { wch: 16 }, // Cidade
    { wch: 26 }, // Dia e Horário
    { wch: 26 }, // VTR - Setor
    { wch: 34 }, // PMs ESCALADO
  ];
  ws['!merges'] = merges;

  // Negrito/centralização exigem estilo de célula (propriedade .s), que a
  // build community/gratuita do XLSX usada aqui (xlsx.full.min.js) costuma
  // IGNORAR silenciosamente ao gravar o .xlsx (recurso restrito à versão
  // Pro da SheetJS). Deixamos a tentativa mesmo assim, sem custo caso seja
  // ignorada pela build atual.
  const titleAddr = window.XLSX.utils.encode_cell({ r:0, c:0 });
  if(ws[titleAddr]) ws[titleAddr].s = { font: { bold:true, sz:14 }, alignment: { horizontal:'center', vertical:'center' } };
  for(let c=0; c<ESCALA_REPORT_HEADERS.length; c++){
    const addr = window.XLSX.utils.encode_cell({ r:headerRow, c });
    if(ws[addr]) ws[addr].s = { font: { bold:true } };
  }

  const wb = window.XLSX.utils.book_new();
  window.XLSX.utils.book_append_sheet(wb, ws, 'Escala Extra');

  const today = new Date();
  const todayStr = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  window.XLSX.writeFile(wb, 'escala-extra-'+todayStr+'.xlsx');
}

// ---------- EXPORTAÇÃO DA ESCALA (DOCX) ----------

function exportEscalaDocx(){
  if(!window.docx){ showToast('Biblioteca de geração de Word não carregou. Verifique sua conexão e recarregue a página.'); return; }

  const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, VerticalMergeType, WidthType, AlignmentType } = window.docx;

  const blocks = buildEscalaReportBlocks();

  const headerCell = (text)=> new TableCell({
    children: [new Paragraph({ children: [new TextRun({ text, bold:true })] })]
  });

  const bodyCell = (text, vmerge)=>{
    const opts = { children: [new Paragraph(text||'')] };
    if(vmerge) opts.verticalMerge = vmerge;
    return new TableCell(opts);
  };

  const tableRows = [
    new TableRow({ children: ESCALA_REPORT_HEADERS.map(headerCell) })
  ];

  blocks.forEach(b=>{
    b.pmLines.forEach((line, i)=>{
      const merge = b.pmLines.length > 1 ? (i===0 ? VerticalMergeType.RESTART : VerticalMergeType.CONTINUE) : undefined;
      tableRows.push(new TableRow({ children: [
        bodyCell(i===0 ? b.cidade : '', merge),
        bodyCell(i===0 ? b.diaHorario : '', merge),
        bodyCell(i===0 ? b.vtrSetor : '', merge),
        bodyCell(line),
      ] }));
    });
  });

  const table = new Table({
    width: { size: 100, type: WidthType.PERCENTAGE },
    rows: tableRows,
  });

  const doc = new Document({
    sections: [{
      children: [
        new Paragraph({
          alignment: AlignmentType.CENTER,
          children: [new TextRun({ text: ESCALA_REPORT_TITLE, bold:true, size:28 })],
        }),
        new Paragraph({ text: '' }),
        table,
        new Paragraph({ text: '' }),
        new Paragraph({ text: '' }),
        new Paragraph({ text: 'Assinado no Original' }),
        new Paragraph({ text: '' }),
        new Paragraph({ text: '___________________________' }),
      ],
    }],
  });

  const today = new Date();
  const todayStr = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');

  Packer.toBlob(doc).then(blob=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'escala-extra-'+todayStr+'.docx';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }).catch(e=>{
    console.error('Erro ao gerar o Word:', e);
    showToast('Erro ao gerar o arquivo Word.');
  });
}

// ---------- IMPORTAÇÃO DE VAGAS EM LOTE (colar texto, uma vaga por linha) ----------

const LOTE_TIME_RE = /^([01]\d|2[0-3]):([0-5]\d)$/;

// Interpreta uma linha no formato 'DD/MM/AAAA;HH:MM;HH:MM;Local;Viatura;Vagas;Fase'.
// Retorna null para linha em branco (ignorada silenciosamente, não conta como
// inválida); senão { raw, valid, shift } (quando válida) ou { raw, valid:false, error }.
function parseLoteLine(rawLine){
  const line = rawLine.trim();
  if(!line) return null;
  const parts = line.split(';');
  if(parts.length !== 7){
    return { raw: rawLine, valid: false, error: 'Esperado 7 campos separados por ";" (encontrado '+parts.length+')' };
  }
  const [dataStr, startStr, endStr, localRaw, viaturaRaw, vagasStr, faseRaw] = parts.map(p=>p.trim());
  const errors = [];

  let dateOut = null;
  const dm = dataStr.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!dm){
    errors.push('data inválida (use DD/MM/AAAA)');
  } else {
    const d = parseInt(dm[1],10), m = parseInt(dm[2],10), y = parseInt(dm[3],10);
    if(d < 1 || d > 31 || m < 1 || m > 12) errors.push('data inválida (use DD/MM/AAAA)');
    else dateOut = y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  }

  if(!LOTE_TIME_RE.test(startStr)) errors.push('horário de início inválido (use HH:MM)');
  if(!LOTE_TIME_RE.test(endStr)) errors.push('horário de término inválido (use HH:MM)');

  const vagasNum = parseInt(vagasStr, 10);
  if(!/^\d+$/.test(vagasStr) || vagasNum < 1) errors.push('quantidade de vagas inválida (use um número inteiro ≥ 1)');

  const faseNorm = faseRaw.toLowerCase();
  if(!FASE_OPTIONS.some(o=>o.v===faseNorm)) errors.push('fase não reconhecida (use sgt, cabo, soldado ou todos)');

  if(errors.length > 0) return { raw: rawLine, valid: false, error: errors.join('; ') };
  return { raw: rawLine, valid: true, shift: { date: dateOut, startTime: startStr, endTime: endStr, local: localRaw, viatura: viaturaRaw, vagas: vagasNum, fase: faseNorm } };
}

// Monta o HTML da tabela de prévia a partir do texto colado (uma linha por
// vaga) e devolve também as vagas válidas já prontas pra persistir e as
// contagens — usado tanto pra atualizar a prévia a cada tecla quanto pra
// decidir o que criar ao confirmar.
function buildLotePreview(text){
  const parsed = text.split(/\r?\n/).map(parseLoteLine).filter(Boolean); // linhas em branco viram null e são descartadas aqui
  if(parsed.length === 0){
    return { html: '<div class="muted-sm">Cole as vagas na área de texto acima para ver a prévia aqui.</div>', validCount: 0, invalidCount: 0, validShifts: [] };
  }
  let html = '<div class="table-wrap"><table class="roster"><thead><tr><th>Data</th><th>Horário</th><th>Local</th><th>Viatura</th><th>Vagas</th><th>Fase</th><th>Status</th></tr></thead><tbody>';
  let validCount = 0, invalidCount = 0;
  const validShifts = [];
  parsed.forEach(p=>{
    if(p.valid){
      validCount++;
      validShifts.push(p.shift);
      const dp = fmtDateParts(p.shift.date);
      html += '<tr><td>'+dp.dnum+'/'+dp.mon+'</td><td>'+escapeHtml(p.shift.startTime)+'–'+escapeHtml(p.shift.endTime)+'</td>'
        + '<td>'+escapeHtml(p.shift.local||'—')+'</td><td>'+escapeHtml(p.shift.viatura||'—')+'</td>'
        + '<td>'+p.shift.vagas+'</td><td>'+escapeHtml(faseLabel(p.shift.fase))+'</td>'
        + '<td style="color:var(--green);">OK</td></tr>';
    } else {
      invalidCount++;
      html += '<tr style="color:var(--red);"><td colspan="7" style="font-family:\'JetBrains Mono\',monospace;font-size:12px;">'+escapeHtml(p.raw)+'</td></tr>'
        + '<tr style="color:var(--red);"><td colspan="7" style="padding-top:0;font-size:11.5px;">↳ '+escapeHtml(p.error)+'</td></tr>';
    }
  });
  html += '</tbody></table></div>'
    + '<div class="muted-sm" style="margin-top:8px;">'+validCount+' vaga(s) válida(s)'+(invalidCount>0 ? ', '+invalidCount+' linha(s) inválida(s) (corrija e cole novamente, se quiser)' : '')+'.</div>';
  return { html, validCount, invalidCount, validShifts };
}

function openLoteImportModal(){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal" style="max-width:640px;">'
    + '<h3>Importar vagas em lote</h3>'
    + '<div class="muted-sm" style="margin-bottom:8px;">Cole uma vaga por linha, no formato: <span style="font-family:\'JetBrains Mono\',monospace;">DD/MM/AAAA;HH:MM;HH:MM;Local;Viatura;Vagas;Fase</span>. Fase pode ser <b>sgt</b>, <b>cabo</b>, <b>soldado</b> ou <b>todos</b>. Local e Viatura podem ficar vazios entre os pontos e vírgulas. Nenhum voluntário é criado — só as vagas.</div>'
    + '<div class="muted-sm" style="margin-bottom:12px;font-family:\'JetBrains Mono\',monospace;font-size:11.5px;">Ex: 05/09/2026;08:00;14:00;RPA Suplementar;1204;2;todos</div>'
    + '<div class="field"><label>Vagas (uma por linha)</label><textarea id="lote-textarea" rows="8" placeholder="05/09/2026;08:00;14:00;RPA Suplementar;1204;2;todos" style="width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:var(--r-sm);font-family:\'JetBrains Mono\',monospace;font-size:12.5px;margin-top:6px;resize:vertical;"></textarea></div>'
    + '<div id="lote-preview">'+buildLotePreview('').html+'</div>'
    + '<div class="modal-actions"><button type="button" class="btn btn-ghost" id="lote-cancel">Cancelar</button><button type="button" class="btn btn-primary" id="lote-confirm" disabled>Confirmar e criar todas</button></div>'
    + '</div>';
  document.body.appendChild(bg);

  const textarea = bg.querySelector('#lote-textarea');
  const previewEl = bg.querySelector('#lote-preview');
  const confirmBtn = bg.querySelector('#lote-confirm');
  if(isDesktopViewport()) textarea.focus();

  let lastResult = { validCount: 0, invalidCount: 0, validShifts: [] };
  const updatePreview = ()=>{
    lastResult = buildLotePreview(textarea.value);
    previewEl.innerHTML = lastResult.html;
    confirmBtn.disabled = lastResult.validCount === 0;
  };
  textarea.oninput = updatePreview;

  bg.querySelector('#lote-cancel').onclick = ()=> bg.remove();
  confirmBtn.onclick = ()=>{
    if(lastResult.validCount === 0) return;
    const newShifts = lastResult.validShifts.map(s=> ({ id: uid(), ...s }));
    shifts.push(...newShifts);
    sortShifts();
    bg.remove();
    showToast(lastResult.validCount+' vaga(s) criada(s)'+(lastResult.invalidCount>0 ? ', '+lastResult.invalidCount+' linha(s) inválida(s) ignorada(s)' : ''));
    render();
    persistBulkUpsert(newShifts, []);
  };
}

function deleteShift(id){
  openConfirmModal({
    titulo: 'Excluir esta vaga?',
    mensagem: 'Excluir esta vaga? Os voluntários cadastrados nela também serão removidos.',
    textoConfirmar: 'Sim, excluir vaga',
    perigo: true,
    onConfirm: ()=>{
      const shift = shifts.find(s=>s.id===id);
      const relatedSignups = signups.filter(s=>s.shiftId===id);
      const newLixeira = addLixeiraEntry('excluir_vaga', { shifts: shift ? [shift] : [], signups: relatedSignups });
      const cascadeIds = relatedSignups.map(s=>s.id);
      shifts = shifts.filter(s=>s.id!==id);
      signups = signups.filter(s=>s.shiftId!==id);
      showToast('Vaga excluída');
      render();
      persistShiftDelete(id, cascadeIds, newLixeira);
    }
  });
}

function loadDemoData(){
  openConfirmModal({
    titulo: 'Carregar dados de exemplo?',
    mensagem: 'Isso vai adicionar vagas e voluntários fictícios à base de dados atual, que já tem dados reais dos policiais. Continuar?',
    textoConfirmar: 'Sim, carregar exemplo',
    onConfirm: ()=>{
      const today = new Date();
      const d1 = new Date(today); d1.setDate(d1.getDate()+3);
      const d2 = new Date(today); d2.setDate(d2.getDate()+5);
      const d3 = new Date(today); d3.setDate(d3.getDate()+7);
      // Monta 'YYYY-MM-DD' a partir dos getters locais (mesmo padrão usado em
      // shiftDateStr/fmtDateParts) em vez de toISOString(), que converte para UTC
      // e pode voltar a data em 1 dia em fusos atrás de UTC (ex: Brasil, UTC-3).
      const fmt = (d)=> d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      const s1 = { id: uid(), date: fmt(d1), startTime:'08:00', endTime:'14:00', local:'Batalhão Central', viatura:'1204', vagas:3, fase:'cabo' };
      const s2 = { id: uid(), date: fmt(d2), startTime:'19:00', endTime:'23:00', local:'Evento - Estádio', viatura:'0817', vagas:2, fase:'soldado' };
      const s3 = { id: uid(), date: fmt(d3), startTime:'06:00', endTime:'12:00', local:'Operação Rodovia', viatura:'', vagas:4, fase:'sgt' };
      shifts.push(s1, s2, s3);
      sortShifts();
      const demoSignups = [
        { id: uid(), shiftId: s1.id, nome: '3º Sgt Carvalho', patente:'sgt', timestamp: new Date().toISOString() },
        { id: uid(), shiftId: s1.id, nome: 'Cb Ferreira', patente:'cabo', timestamp: new Date().toISOString() },
        { id: uid(), shiftId: s2.id, nome: 'Sd Almeida', patente:'soldado', timestamp: new Date().toISOString() },
        { id: uid(), shiftId: s2.id, nome: 'Sd Rocha', patente:'soldado', timestamp: new Date().toISOString() },
        { id: uid(), shiftId: s3.id, nome: '2º Sgt Barros', patente:'sgt', timestamp: new Date().toISOString() },
      ];
      signups.push(...demoSignups);
      showToast('Exemplo carregado');
      render();
      persistBulkUpsert([s1, s2, s3], demoSignups);
    }
  });
}

function clearAllData(){
  openConfirmModal({
    titulo: 'Apagar todas as vagas e voluntários?',
    mensagem: 'Esta ação é irreversível e vai apagar PERMANENTEMENTE todas as vagas extras e voluntários cadastrados atualmente, incluindo dados reais dos policiais. Esta ação não pode ser desfeita.',
    textoConfirmar: 'Sim, apagar tudo',
    perigo: true,
    onConfirm: ()=>{
      const newLixeira = addLixeiraEntry('apagar_tudo', { shifts, signups });
      shifts = [];
      signups = [];
      showToast('Tudo apagado');
      render();
      persistWipeAll(newLixeira);
    }
  });
}

// Mostra/esconde a tela de bloqueio total, sobrepondo qualquer outro
// conteúdo da página (tela pública, administração, abas). Não existe
// nenhum controle dentro do app que altere 'bloqueioTotal' — o campo só
// é editado manualmente no console do Firestore.
function updateLockScreen(){
  const lockEl = document.getElementById('lock-screen');
  const wrapEl = document.querySelector('.wrap');
  const toastEl = document.getElementById('toast');
  if(bloqueioTotal){
    lockEl.style.display = 'flex';
    wrapEl.style.display = 'none';
    if(toastEl) toastEl.classList.remove('show');
  } else {
    lockEl.style.display = 'none';
    wrapEl.style.display = '';
  }
}

function render(){
  updateLockScreen();
  if(bloqueioTotal) return; // bloqueio prevalece sobre qualquer estado local (aba ativa, PIN validado, etc.)
  renderVagas(); renderAdmin(); refreshDatalists();
}

let unsubscribeRealtime = null;

function attachRealtimeListener(){
  if(unsubscribeRealtime) return; // já anexado — nunca duplica o listener
  unsubscribeRealtime = onSnapshot(docRef, (snap)=>{
    try{
      if(!snap.exists()){
        setDoc(docRef, { pin: null, shifts: {}, signups: {}, bloqueioTotal: false }, { merge: true }).catch(e=>console.error(e));
        return; // o próprio setDoc acima vai disparar este listener de novo
      }
      applyRemoteData(snap.data());
      render();
    }catch(e){
      console.error('Erro ao processar atualização em tempo real:', e);
    }
  }, (err)=>{
    console.error('Erro no listener em tempo real:', err);
    showToast('Erro de sincronização em tempo real');
  });
}

(async function init(){
  try{ await signInAnonymously(auth); }
  catch(e){ console.error(e); showToast('Erro ao conectar. Verifique sua conexão.'); }
  attachRealtimeListener();
})();
