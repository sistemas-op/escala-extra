<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escala de Serviço Extra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d141f; --panel:#16202e; --panel-2:#1c2a3c; --border:#25384d;
    --text:#e9eef4; --muted:#8a9bb0; --amber:#e8a33d; --amber-dim:#3a2e18;
    --green:#34d399; --green-dim:#12291f; --red:#ef5757; --red-dim:#331818;
    --blue:#5b9bd5; --blue-dim:#152838;
    --green-inst:#2f6b4f; --green-inst-dim:#132a20;
    --r-sm:4px; --r-md:6px; --r-pill:999px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px 64px;}
  header{background:var(--panel);margin:0 -16px 22px;padding:32px 20px 26px;text-align:center;}
  header::after{content:"";display:block;height:4px;margin-top:22px;background:repeating-linear-gradient(45deg,var(--green-inst) 0 10px,transparent 10px 20px);opacity:.5;}
  header .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:var(--amber);text-transform:uppercase;}
  header .title-row{display:flex;align-items:stretch;justify-content:center;gap:16px;margin-top:8px;}
  header .title-block{display:flex;flex-direction:column;justify-content:center;min-width:0;}
  header .crest{height:auto;width:auto;max-width:110px;flex-shrink:0;object-fit:contain;}
  header h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:32px;letter-spacing:.01em;margin:0;text-transform:uppercase;}
  header .battalion{margin-top:10px;}
  header .battalion .bat-line1{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.05em;color:var(--text);}
  header .battalion .bat-line2{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--muted);font-style:italic;margin-top:3px;}
  .stripe{height:4px;margin-top:16px;background:repeating-linear-gradient(45deg,var(--amber) 0 10px,transparent 10px 20px);opacity:.55;}
  @media (max-width:420px){
    header .crest{max-width:64px;}
    header .title-row{gap:10px;}
    header h1{font-size:24px;}
  }
  nav.tabs{display:flex;gap:4px;margin:20px 0 18px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:4px;}
  nav.tabs button{flex:1;padding:10px 8px;background:transparent;border:none;color:var(--muted);font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:.04em;text-transform:uppercase;border-radius:var(--r-sm);cursor:pointer;}
  nav.tabs button.active{background:var(--panel-2);color:var(--amber);}
  .card{background:var(--panel);border:1px solid var(--border);border-top:3px solid var(--green-inst);border-radius:var(--r-md);padding:16px;margin-bottom:14px;}
  .section-title{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:14px;color:var(--text);margin-bottom:10px;}
  .section-title.accent{color:var(--amber);}
  .shift-card{display:flex;gap:14px;}
  .shift-date{font-family:'Oswald',sans-serif;text-align:center;min-width:58px;background:var(--panel-2);border-radius:var(--r-sm);padding:8px 4px;height:fit-content;}
  .shift-date .dow{font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;}
  .shift-date .dnum{font-size:22px;font-weight:600;line-height:1.1;}
  .shift-date .mon{font-size:10px;color:var(--muted);text-transform:uppercase;}
  .shift-body{flex:1;min-width:0;}
  .shift-time{font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--amber);}
  .shift-local{font-size:13px;color:var(--muted);margin-top:2px;}
  .shift-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:8px;}
  .badge{font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:3px 9px;border-radius:var(--r-pill);display:inline-block;}
  .badge.open{background:var(--green-dim);color:var(--green);}
  .badge.full{background:var(--red-dim);color:var(--red);}
  .badge.phase{background:var(--blue-dim);color:var(--blue);font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.03em;}
  .names{margin-top:10px;font-size:13px;color:var(--muted);line-height:1.6;}
  .name-chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--border);padding:3px 8px 3px 10px;border-radius:var(--r-pill);margin:2px 4px 2px 0;font-size:12.5px;}
  .btn{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:12.5px;border:none;border-radius:var(--r-sm);padding:9px 13px;cursor:pointer;}
  .btn-primary{background:var(--amber);color:#1a1204;}
  .btn-primary:disabled{background:var(--panel-2);color:var(--muted);cursor:not-allowed;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-danger{background:var(--red-dim);color:var(--red);border:1px solid #4a2222;}
  .btn-blue{background:var(--blue-dim);color:var(--blue);border:1px solid #234258;}
  .btn-block{width:100%;margin-top:12px;}
  .btn-sm{padding:6px 10px;font-size:11px;min-height:40px;display:inline-flex;align-items:center;}
  input,select{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:var(--r-sm);font-family:'Inter',sans-serif;font-size:14px;margin-top:6px;}
  label{font-size:12.5px;color:var(--muted);letter-spacing:.03em;font-family:'Inter',sans-serif;font-weight:600;font-variant:small-caps;}
  .field{margin-bottom:12px;}
  .input-error{border-color:var(--red);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .row4{display:grid;grid-template-columns:1fr 0.8fr 1.4fr 1fr;gap:10px;}
  .empty{text-align:center;color:var(--muted);padding:36px 12px;font-size:14px;}
  .empty .big{font-family:'Oswald',sans-serif;font-size:16px;color:var(--text);text-transform:uppercase;margin-bottom:4px;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md) var(--r-md) 0 0;padding:20px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;}
  .modal h3{font-family:'Oswald',sans-serif;text-transform:uppercase;margin:0 0 14px;font-size:17px;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions .btn{flex:1;}
  .pin-gate{text-align:center;padding:50px 16px;}
  .pin-gate .lock{font-size:32px;margin-bottom:10px;}
  .pin-gate input{max-width:200px;margin:14px auto 0;text-align:center;letter-spacing:.3em;font-family:'JetBrains Mono',monospace;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:var(--r-pill);font-size:13px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}
  .refresh-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .muted-sm{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
  .link-btn{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:12px;cursor:pointer;padding:6px 10px;min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;}
  table.roster{width:100%;border-collapse:collapse;font-size:13px;}
  table.roster th{text-align:left;font-family:'JetBrains Mono',monospace;text-transform:uppercase;font-size:10.5px;letter-spacing:.06em;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--border);}
  table.roster td{padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:middle;}
  table.roster input, table.roster select{margin-top:0;padding:6px 8px;font-size:12.5px;}
  .table-wrap{overflow-x:auto;}
  .rank-tag{font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:2px 7px;border-radius:var(--r-pill);background:var(--panel-2);color:var(--muted);}
  .rank-tag.sgt{color:var(--amber);}
  .rank-tag.cabo{color:var(--blue);}
  .rank-tag.soldado{color:var(--green);}
  .app-footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--green-inst-dim);text-align:center;font-family:'Inter',sans-serif;font-size:11.5px;color:var(--muted);}
  .lock-screen{position:fixed;inset:0;background:var(--bg);color:var(--muted);display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:'Inter',sans-serif;font-size:15px;z-index:200;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Serviço Voluntário &middot; Extras</div>
    <div class="title-row">
      <img class="crest" src="brasao-pmpr.png" alt="Brasão PMPR">
      <div class="title-block">
        <h1>Escala de Serviço Extra</h1>
        <div class="battalion">
          <div class="bat-line1">16º BATALHÃO DE POLÍCIA MILITAR</div>
          <div class="bat-line2">Batalhão 3º Sargento PM Ricieri Chagas</div>
        </div>
        <div class="stripe"></div>
      </div>
      <img class="crest" src="brasao-16bpm.png" alt="Brasão 16º BPM">
    </div>
  </header>
  <nav class="tabs">
    <button id="tab-vagas" class="active">Vagas Disponíveis</button>
    <button id="tab-admin">Administração</button>
  </nav>
  <div id="view-vagas"></div>
  <div id="view-admin" style="display:none;"></div>
  <footer class="app-footer">Desenvolvido por Eduardo Valgoi</footer>
</div>
<div id="lock-screen" class="lock-screen">Sistema temporariamente indisponível.</div>
<div id="toast" class="toast"></div>
<datalist id="datalist-nomes"></datalist>
<datalist id="datalist-locais"></datalist>
<datalist id="datalist-viaturas"></datalist>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.7.2/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- "docx" (dolanmiu/docx) não é espelhada no cdnjs — usamos o build UMD oficial via jsDelivr, que expõe window.docx -->
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, onSnapshot, setDoc, updateDoc, getDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDINaHpd3Ig0JzlLe3TK_MQbICETdrQv1o",
  authDomain: "escala-extra-pmpr.firebaseapp.com",
  projectId: "escala-extra-pmpr",
  storageBucket: "escala-extra-pmpr.firebasestorage.app",
  messagingSenderId: "129550161576",
  appId: "1:129550161576:web:08d613bdc17399e628d49d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const docRef = doc(db, 'escala', 'estado');

if(window.pdfjsLib){
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

let shifts = [];
let signups = [];
let bloqueioTotal = false; // só é alterado via campo 'bloqueioTotal' no Firestore (console do Firebase) — nunca por UI
let adminUnlocked = false;
let currentPin = null;
let editingShiftId = null;
let activeTab = 'vagas';
let periodosEscala = [];       // [{ id, vigenciaInicio:'YYYY-MM-DDTHH:mm', equipes:{A:[{funcao,patente,nome,cpf}], B:[...], C:[...], D:[...]} }, ...] — ordenado por vigenciaInicio; ver getEscalaVigente()
let equipesImportFormOpen = false; // true enquanto o admin está importando um novo período de escala de equipes
let calendarioOficial = null;  // { 'YYYY-MM-DD': { dia:'A', noite:'B' }, ... } — entradas EXPLÍCITAS (import/edição manual); dado único e independente dos períodos de escala
let cicloEscala = null;        // { dataAncora:'YYYY-MM-DD', periodoDias:P, padrao:[{dia,noite}, ...] } ou null — ver detectCiclo()
let calendarImportFormOpen = false; // true enquanto o admin está substituindo o calendário mensal já importado
let lixeira = [];              // [{ id, timestamp:ISO, tipo:'apagar_tudo'|'excluir_vaga', dadosOriginais:{shifts:[...], signups:[...]} }, ...] — mais recente primeiro; ver addLixeiraEntry()
const LIXEIRA_MAX = 20;        // entradas mais antigas além desse limite são descartadas ao adicionar uma nova

const RANK_ORDER = ['sgt','cabo','soldado'];
const RANK_LABEL = {sgt:'Sargento', cabo:'Cabo', soldado:'Soldado'};
const RANK_ABBR = {sgt:'Sgt.', cabo:'Cb.', soldado:'Sd.'}; // usado no relatório oficial (coluna "PMs ESCALADO")
const TEAM_LETTERS = ['A','B','C','D'];
const TURNO_LABEL = { dia: 'Dia', noite: 'Noite' };

// Fases de liberação de uma vaga: grupos EXATOS e independentes (sem cascata).
// 'sgt'/'cabo'/'soldado' liberam só aquela patente; 'todos' libera as três.
const FASE_OPTIONS = [
  { v:'sgt', label:'Somente Sargentos' },
  { v:'cabo', label:'Somente Cabos' },
  { v:'soldado', label:'Somente Soldados' },
  { v:'todos', label:'Todos (Sgt, Cabo, Sd)' }
];
const FASE_LABEL = { sgt:'Somente Sargentos', cabo:'Somente Cabos', soldado:'Somente Soldados', todos:'Todos os postos/graduações' };

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
// A serialização de texto do navegador (textContent -> innerHTML) já escapa
// & < > sozinha, mas NÃO escapa aspas simples/duplas (elas não precisam de
// escape dentro de um nó de texto). Isso torna o resultado inseguro sempre
// que for inserido dentro de um atributo HTML delimitado por aspas (ex:
// value="..."), porque uma aspa literal no dado quebra pra fora do atributo
// e vira HTML/atributo novo. Por isso escapamos aspas manualmente aqui —
// função é usada tanto em texto quanto em atributos por todo o app.
function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }
// Usado para decidir se um campo deve receber foco automático ao abrir um
// modal: em telas pequenas isso abriria o teclado virtual imediatamente,
// cobrindo o próprio modal, então só focamos automaticamente em telas
// maiores (desktop/tablet).
function isDesktopViewport(){ return window.matchMedia('(min-width:768px)').matches; }
// Marca um campo com borda vermelha (classe .input-error) além do toast já
// exibido; a marca some sozinha assim que o usuário mexer no campo de novo.
function flagInvalid(el){
  if(!el) return;
  el.classList.add('input-error');
  const clear = ()=> el.classList.remove('input-error');
  el.addEventListener('input', clear, { once:true });
  el.addEventListener('change', clear, { once:true });
}
function allowedRanks(fase){
  if(fase === 'todos') return ['sgt','cabo','soldado'];
  if(fase === 'sgt' || fase === 'cabo' || fase === 'soldado') return [fase];
  return ['sgt']; // fallback defensivo para valor de fase ausente/inesperado
}
function faseLabel(fase){ return FASE_LABEL[fase] || FASE_LABEL.sgt; }
// Cor de destaque (borda superior do card) por fase liberada: reaproveita o
// mesmo mapeamento de cor já usado nos rank-tags (sgt=âmbar, cabo=azul,
// soldado=verde-menta); 'todos' usa o verde institucional, marcando a
// abertura total como o estado de maior "peso" visual.
function faseBorderColor(fase){
  if(fase === 'sgt') return 'var(--amber)';
  if(fase === 'cabo') return 'var(--blue)';
  if(fase === 'soldado') return 'var(--green)';
  return 'var(--green-inst)';
}
function faseSelectOptions(selected){
  return FASE_OPTIONS.map(o=>'<option value="'+o.v+'" '+(o.v===selected?'selected':'')+'>'+o.label+'</option>').join('');
}
function metaLine(s){ const parts=[]; if(s.local) parts.push(escapeHtml(s.local)); if(s.viatura) parts.push('Viatura '+escapeHtml(s.viatura)); return parts.join(' &middot; '); }
function sortShifts(){ shifts.sort((a,b)=> (a.date+a.startTime).localeCompare(b.date+b.startTime)); }

// ---------- AUTOCOMPLETAR (datalists a partir dos dados já em memória) ----------

function uniqueNonEmpty(arr){
  const seen = new Set();
  const out = [];
  for(const v of arr){
    const t = (v||'').trim();
    if(!t || seen.has(t.toLowerCase())) continue;
    seen.add(t.toLowerCase());
    out.push(t);
  }
  return out;
}
function refreshDatalists(){
  const nomesEl = document.getElementById('datalist-nomes');
  const locaisEl = document.getElementById('datalist-locais');
  const viaturasEl = document.getElementById('datalist-viaturas');
  if(nomesEl) nomesEl.innerHTML = uniqueNonEmpty(signups.map(s=>s.nome)).map(v=>'<option value="'+escapeHtml(v)+'">').join('');
  if(locaisEl) locaisEl.innerHTML = uniqueNonEmpty(shifts.map(s=>s.local)).map(v=>'<option value="'+escapeHtml(v)+'">').join('');
  if(viaturasEl) viaturasEl.innerHTML = uniqueNonEmpty(shifts.map(s=>s.viatura)).map(v=>'<option value="'+escapeHtml(v)+'">').join('');
}

// ---------- FIRESTORE SYNC (documento único: escala/estado) ----------
// shifts e signups são guardados no documento como MAPAS (objeto id -> item),
// não como arrays. Isso permite gravar/apagar um item por vez (merge por
// caminho de campo), então duas abas mexendo em itens diferentes ao mesmo
// tempo nunca sobrescrevem uma a outra — só o item alterado é tocado.

function applyRemoteData(data){
  // Checado antes de qualquer outro campo: se o bloqueio total estiver
  // ativo, render() vai curto-circuitar e nada mais do estado remoto
  // (pin, vagas, etc.) chega a ser exibido nesta passada.
  bloqueioTotal = !!data.bloqueioTotal;
  currentPin = data.pin ?? null;
  shifts = Object.values(data.shifts || {}).map(s=>({...s}));
  shifts.forEach(s=>{ if(!s.fase) s.fase='sgt'; });
  sortShifts();
  signups = Object.values(data.signups || {}).map(s=>({...s}));
  periodosEscala = migratePeriodosEscala(data);
  calendarioOficial = data.calendarioOficial || null;
  cicloEscala = data.cicloEscala || null;
  lixeira = Array.isArray(data.lixeira) ? data.lixeira : [];
}

// Compatibilidade com dados antigos: documentos gravados antes da introdução
// de múltiplos períodos de vigência tinham um único campo 'escalaOficial'
// ({A,B,C,D}). Se 'periodosEscala' ainda não existir no documento, ele é
// convertido aqui (só em memória, sem gravar nada) num único período com
// vigenciaInicio bem antiga, preservando o comportamento atual (requisito de
// não-regressão quando só há 1 período). Assim que o admin importar/editar
// pela nova tela, o período passa a ser persistido normalmente.
function migratePeriodosEscala(data){
  let list;
  if(Array.isArray(data.periodosEscala)) list = data.periodosEscala.slice();
  else if(data.escalaOficial) list = [{ id:'legacy', vigenciaInicio:'1970-01-01T00:00', equipes:data.escalaOficial }];
  else list = [];
  return list.slice().sort((a,b)=> (a.vigenciaInicio||'').localeCompare(b.vigenciaInicio||''));
}

function handlePersistError(e){
  console.error(e);
  showToast('Erro ao sincronizar com o servidor');
}

// Grava/atualiza campos de nível superior (ex: pin) preservando os demais.
function persist(patch){
  setDoc(docRef, patch, { merge: true }).catch(handlePersistError);
}

// Upsert/delete granulares: tocam só a chave do item alterado dentro do
// mapa shifts/signups, sem substituir o mapa inteiro.
function persistShiftUpsert(shift){
  setDoc(docRef, { shifts: { [shift.id]: shift } }, { merge: true }).catch(handlePersistError);
}
// newLixeira (opcional) é gravado junto, no mesmo patch — garante que a
// entrada da lixeira e a exclusão da vaga cheguem ao Firestore como uma única
// escrita (sem risco de a vaga sumir sem que a cópia de segurança tenha sido
// salva antes).
function persistShiftDelete(id, cascadeSignupIds, newLixeira){
  const patch = { shifts: { [id]: deleteField() } };
  if(cascadeSignupIds && cascadeSignupIds.length){
    patch.signups = {};
    cascadeSignupIds.forEach(sid=>{ patch.signups[sid] = deleteField(); });
  }
  if(newLixeira) patch.lixeira = newLixeira;
  setDoc(docRef, patch, { merge: true }).catch(handlePersistError);
}
function persistSignupUpsert(su){
  setDoc(docRef, { signups: { [su.id]: su } }, { merge: true }).catch(handlePersistError);
}
function persistSignupDelete(id){
  setDoc(docRef, { signups: { [id]: deleteField() } }, { merge: true }).catch(handlePersistError);
}
// Bulk upsert (ex: dados de exemplo): mescla várias chaves novas de uma vez.
function persistBulkUpsert(newShifts, newSignups){
  const patch = {};
  if(newShifts && newShifts.length){ patch.shifts = {}; newShifts.forEach(s=>{ patch.shifts[s.id] = s; }); }
  if(newSignups && newSignups.length){ patch.signups = {}; newSignups.forEach(su=>{ patch.signups[su.id] = su; }); }
  setDoc(docRef, patch, { merge: true }).catch(handlePersistError);
}
// "Apagar tudo": substitui os mapas inteiros por vazios (precisa de
// updateDoc, já que setDoc com merge:true e {} não apaga chaves existentes).
// newLixeira (opcional) é gravado no mesmo updateDoc — a cópia de segurança
// entra no documento atomicamente junto com o próprio wipe.
function persistWipeAll(newLixeira){
  const patch = { shifts: {}, signups: {} };
  if(newLixeira) patch.lixeira = newLixeira;
  updateDoc(docRef, patch).catch(handlePersistError);
}
// Monta uma nova entrada de lixeira (cópia profunda dos dados que a ação
// destrutiva está prestes a apagar) e devolve a lista já atualizada — mais
// recente primeiro, truncada em LIXEIRA_MAX. Só atualiza 'lixeira' em
// memória; quem chama é responsável por incluir a lista devolvida no mesmo
// patch/persist da ação destrutiva (ver persistShiftDelete/persistWipeAll).
function addLixeiraEntry(tipo, dadosOriginais){
  const entry = {
    id: uid(),
    timestamp: new Date().toISOString(),
    tipo,
    dadosOriginais: JSON.parse(JSON.stringify(dadosOriginais))
  };
  lixeira = [entry, ...lixeira].slice(0, LIXEIRA_MAX);
  return lixeira;
}

const LIXEIRA_TIPO_LABEL = { apagar_tudo: 'Apagar tudo', excluir_vaga: 'Excluir vaga' };

function fmtLixeiraTimestamp(iso){
  const d = new Date(iso);
  if(isNaN(d)) return '--';
  const pad = n=>String(n).padStart(2,'0');
  return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}

// Resumo legível de uma entrada, ex: "3 vaga(s) e 7 voluntário(s)" (apagar
// tudo) ou "Vaga de 04/09 às 08:00 (2 voluntário(s))" (excluir vaga).
function lixeiraResumo(entry){
  const d = entry.dadosOriginais || {};
  const shiftsList = d.shifts || [];
  const signupsList = d.signups || [];
  if(entry.tipo === 'excluir_vaga'){
    const s = shiftsList[0];
    if(!s) return signupsList.length+' voluntário(s)';
    const dp = fmtDateParts(s.date);
    return 'Vaga de '+dp.dnum+'/'+dp.mon+' às '+(s.startTime||'--:--')+' ('+signupsList.length+' voluntário(s))';
  }
  return shiftsList.length+' vaga(s) e '+signupsList.length+' voluntário(s)';
}

// Restaura uma entrada da lixeira: acrescenta de volta só os shifts/signups
// cujo id ainda não existe no estado atual (merge aditivo puro) — nunca
// sobrescreve nem apaga nada criado depois da ação original que gerou essa
// entrada.
function restaurarLixeira(id){
  const entry = lixeira.find(x=>x.id===id);
  if(!entry) return;
  openConfirmModal({
    titulo: 'Restaurar esta entrada da lixeira?',
    mensagem: 'Isso vai recolocar de volta: '+lixeiraResumo(entry)+'. Dados criados depois dessa ação não são apagados — a restauração só adiciona de volta o que estava faltando.',
    textoConfirmar: 'Sim, restaurar',
    onConfirm: ()=>{
      const restoredShifts = (entry.dadosOriginais.shifts || []).filter(s=> !shifts.some(x=>x.id===s.id));
      const restoredSignups = (entry.dadosOriginais.signups || []).filter(su=> !signups.some(x=>x.id===su.id));
      restoredShifts.forEach(s=> shifts.push({...s}));
      restoredSignups.forEach(su=> signups.push({...su}));
      sortShifts();
      showToast('Dados restaurados');
      render();
      persistBulkUpsert(restoredShifts, restoredSignups);
    }
  });
}
// Grava o array de períodos de escala por inteiro (substitui, não faz merge
// elemento a elemento — cada chamada já reflete o array completo e atualizado
// em memória, incluindo períodos antigos preservados).
function persistPeriodosEscala(list){
  updateDoc(docRef, { periodosEscala: list }).catch(handlePersistError);
}

// Grava o calendário mensal + ciclo detectado, substituindo os campos por
// inteiro. Usa updateDoc (não setDoc com merge:true) de propósito: setDoc
// com merge:true faz merge PROFUNDO de campos que são mapas — calendarioOficial
// é um mapa 'YYYY-MM-DD' -> {dia,noite}, então um merge raso nunca apagaria
// datas antigas que não estejam no novo calendário (ex: reimportar agosto
// depois de já ter julho salvo deixaria os 31 dias de julho "grudados" junto
// aos de agosto). updateDoc substitui o valor inteiro do campo, sem essa
// armadilha. Se nenhum ciclo for detectado, cicloEscala é explicitamente
// apagado (deleteField) em vez de deixar um ciclo antigo e potencialmente
// inválido para os novos dados.
function persistCalendarioOficial(calendar, ciclo){
  const patch = { calendarioOficial: calendar, cicloEscala: ciclo || deleteField() };
  updateDoc(docRef, patch).catch(handlePersistError);
}

async function refreshAll(){
  try{
    const snap = await getDoc(docRef);
    if(snap.exists()) applyRemoteData(snap.data());
  }catch(e){}
  render();
}

const DOW = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const MON = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
// Extrai {ano,mes,dia} numéricos de uma string 'YYYY-MM-DD', ou null se a
// string estiver ausente/malformada (dado antigo/corrompido). Usado por todo
// código que precisa comparar ou exibir a data de uma vaga sem arriscar
// derrubar a tela inteira por causa de um único registro ruim.
function parseDateStr(dateStr){
  if(!dateStr || typeof dateStr !== 'string') return null;
  const parts = dateStr.split('-').map(Number);
  const [y,m,d] = parts;
  if(parts.length !== 3 || !Number.isFinite(y) || !Number.isFinite(m) || !Number.isFinite(d) || m < 1 || m > 12 || d < 1 || d > 31) return null;
  return { y, m, d };
}
function fmtDateParts(dateStr){
  const p = parseDateStr(dateStr);
  if(!p) return { dow:'--', dnum:'--', mon:'--' };
  const dt = new Date(p.y, p.m-1, p.d);
  return { dow: DOW[dt.getDay()], dnum: String(p.d).padStart(2,'0'), mon: MON[p.m-1] };
}
function signupsFor(shiftId){ return signups.filter(s => s.shiftId === shiftId); }

// ---------- CRUZAMENTO COM A ESCALA OFICIAL (RPA/COPOM) ----------

function maskCpf(value){
  let v = (value||'').replace(/\D/g,'').slice(0,11);
  if(v.length > 9) return v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
  if(v.length > 6) return v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
  if(v.length > 3) return v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
  return v;
}

function isValidCpfShape(cpf){
  return /^[0-9Xx]{3}\.[0-9Xx]{3}\.[0-9Xx]{3}-[0-9Xx]{2}$/.test((cpf||'').trim());
}

// Compara um CPF completo digitado (11 dígitos) com um CPF da escala oficial
// que pode vir parcialmente mascarado (X no lugar de dígitos ocultos).
function cpfMatchesMasked(inputDigits, storedCpfRaw){
  const stored = (storedCpfRaw||'').replace(/[.\-\s]/g,'').toUpperCase();
  if(stored.length !== 11 || inputDigits.length !== 11) return false;
  for(let i=0;i<11;i++){
    const c = stored[i];
    if(c === 'X') continue;
    if(c !== inputDigits[i]) return false;
  }
  return true;
}

// Policiais cuja função contém "suplementar" (ex: "RPA Suplementar") têm
// horário variável, decidido à parte — não seguem o turno fixo Dia (06-18) /
// Noite (18-06) do calendário de rodízio, então são ignorados apenas na
// checagem de conflito de escala/descanso mínimo (ver findEscalaConflict e
// findRestConflict). Eles continuam aparecendo normalmente em todas as telas
// de cadastro/edição da escala de equipes — isso só afeta essas duas checagens.
function isFuncaoSuplementar(funcao){
  const normalized = (funcao||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  return normalized.includes('suplementar');
}

function shiftDateStr(dateStr, deltaDays){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d + deltaDays);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}

// ---------- CICLO DE RODÍZIO (detecção automática a partir do calendário oficial) ----------

// Diferença em dias inteiros entre duas datas 'YYYY-MM-DD' (b - a). Construído
// com o mesmo padrão de Date local usado em shiftDateStr/fmtDateParts (nunca
// new Date('YYYY-MM-DD'), que o motor interpreta como UTC e pode voltar/
// avançar um dia ao exibir em fuso horário local, ex: Brasil UTC-3).
function daysBetween(dateStrA, dateStrB){
  const a = parseDateStr(dateStrA), b = parseDateStr(dateStrB);
  if(!a || !b) return null;
  const dtA = new Date(a.y, a.m-1, a.d);
  const dtB = new Date(b.y, b.m-1, b.d);
  return Math.round((dtB - dtA) / 86400000);
}

// Detecta o menor período P (em dias) tal que o padrão {dia,noite} do
// calendário se repita a cada P dias, ancorado na data mais antiga presente.
// Testa P de 2 até metade da quantidade de dias válidos disponíveis, e só
// aceita um período se TODAS as datas disponíveis forem consistentes com ele
// (sem contradição) e cada posição do ciclo tiver sido observada em pelo
// menos 2 datas diferentes (ou seja, pelo menos 2 ciclos completos
// confirmados nos dados). Datas não precisam ser contíguas — a posição de
// cada uma no ciclo é calculada pela distância em dias até a âncora, não pelo
// índice na lista, então buracos no calendário não atrapalham a detecção
// (só reduzem a quantidade de confirmações disponíveis).
function detectCiclo(calendario){
  if(!calendario) return null;
  const dates = Object.keys(calendario).filter(d=>{
    const e = calendario[d];
    return e && e.dia && e.noite;
  }).sort();
  const n = dates.length;
  if(n < 4) return null; // mínimo pra sequer tentar P=2 com 2 ciclos completos
  const anchor = dates[0];
  const maxP = Math.floor(n/2);
  for(let P=2; P<=maxP; P++){
    const padrao = new Array(P).fill(null);
    const counts = new Array(P).fill(0);
    let ok = true;
    for(const d of dates){
      const diff = daysBetween(anchor, d);
      const pos = ((diff % P) + P) % P;
      const entry = calendario[d];
      if(padrao[pos] == null){
        padrao[pos] = { dia: entry.dia, noite: entry.noite };
      } else if(padrao[pos].dia !== entry.dia || padrao[pos].noite !== entry.noite){
        ok = false; break;
      }
      counts[pos]++;
    }
    if(!ok) continue;
    if(padrao.some(x=>x==null)) continue; // ciclo com posição nunca observada não pode ser confirmado
    if(Math.min(...counts) < 2) continue; // exige pelo menos 2 ciclos completos confirmados
    return { dataAncora: anchor, periodoDias: P, padrao };
  }
  return null;
}

// Turno oficial (equipes de dia/noite) de uma data: (a) entrada EXPLÍCITA em
// calendarioOficial sempre tem prioridade — cobre importações e edições
// manuais pontuais; (b) na ausência dela, cai pro ciclo de rodízio detectado
// (se houver), projetando o padrão indefinidamente para o futuro sem exigir
// reimportação mensal; (c) sem nenhum dos dois, retorna null (comportamento
// atual: checagem de conflito é pulada pra essa data).
function getEquipeDoTurno(dataStr){
  if(calendarioOficial && calendarioOficial[dataStr]) return calendarioOficial[dataStr];
  if(cicloEscala){
    const diff = daysBetween(cicloEscala.dataAncora, dataStr);
    if(diff == null) return null;
    const P = cicloEscala.periodoDias;
    const pos = ((diff % P) + P) % P;
    return cicloEscala.padrao[pos] || null;
  }
  return null;
}

// Instante (ISO 'YYYY-MM-DDTHH:mm') em que um turno oficial começa numa data:
// Dia começa 06:00, Noite começa 18:00 (do próprio dia informado). Usado para
// consultar qual período de vigência da escala de equipes estava valendo
// quando aquele turno específico começou — ver getEscalaVigente().
function turnoStartISO(dateStr, turno){
  return dateStr + 'T' + (turno === 'dia' ? '06:00' : '18:00');
}

// Retorna o período de periodosEscala (composição de equipes) que estava
// vigente num instante específico: o de vigenciaInicio mais recente dentre os
// que já haviam começado até aquele instante. Com apenas 1 período cadastrado
// (caso comum/legado), sempre retorna esse período único, preservando o
// comportamento anterior.
function getEscalaVigente(dataHoraISO){
  if(!periodosEscala || periodosEscala.length === 0) return null;
  let chosen = null;
  for(const p of periodosEscala){
    if(p.vigenciaInicio <= dataHoraISO && (!chosen || p.vigenciaInicio > chosen.vigenciaInicio)) chosen = p;
  }
  return chosen;
}

function fmtDateNumeric(dateStr){
  const p = parseDateStr(dateStr);
  if(!p) return dateStr;
  return String(p.d).padStart(2,'0')+'/'+String(p.m).padStart(2,'0')+'/'+p.y;
}

function formatCicloLabel(ciclo){
  if(!ciclo) return 'Nenhum ciclo de rodízio detectado com os dados atuais — são necessárias pelo menos 2 repetições completas do padrão para confirmar um ciclo. Enquanto isso, a checagem de conflito vale só para as datas explicitamente importadas/editadas.';
  return 'Ciclo de rodízio detectado: repete a cada '+ciclo.periodoDias+' dia(s), a partir de '+fmtDateNumeric(ciclo.dataAncora)+' — aplicado automaticamente aos meses seguintes, sem precisar reimportar.';
}

// Turno Dia = 06:00–18:00. Turno Noite = 18:00–06:00 (atravessa a meia-noite).
// Retorna quais turnos oficiais (do próprio dia da vaga e, se for o caso, o
// turno Noite do dia anterior) se sobrepõem ao horário da vaga extra.
function overlappingTurnos(startTime, endTime){
  const toMin = t=>{ const [h,m]=t.split(':').map(Number); return h*60+m; };
  let s = toMin(startTime), e = toMin(endTime);
  if(e <= s) e += 1440; // vaga atravessa a meia-noite
  const overlaps = (aS,aE)=> s < aE && e > aS;
  const result = [];
  if(overlaps(360,1080)) result.push({ offsetDays:0, turno:'dia' });
  if(overlaps(1080,1800)) result.push({ offsetDays:0, turno:'noite' });
  if(s < 360) result.push({ offsetDays:-1, turno:'noite' }); // cauda do plantão noturno do dia anterior
  return result;
}

// Verifica se o CPF informado já está escalado no serviço normal em algum
// turno que se sobrepõe ao horário da vaga extra. Retorna null se não há
// conflito (ou se a escala oficial ainda não foi importada).
function findEscalaConflict(dateStr, startTime, endTime, cpfDigits){
  if(!periodosEscala.length) return null;
  const turnos = overlappingTurnos(startTime, endTime);
  for(const t of turnos){
    const targetDate = t.offsetDays === 0 ? dateStr : shiftDateStr(dateStr, t.offsetDays);
    const diaCal = getEquipeDoTurno(targetDate);
    if(!diaCal) continue;
    const equipeLetra = diaCal[t.turno];
    if(!equipeLetra) continue;
    const periodo = getEscalaVigente(turnoStartISO(targetDate, t.turno));
    if(!periodo) continue;
    const membros = periodo.equipes[equipeLetra];
    if(!membros) continue;
    const found = membros.find(m=> !isFuncaoSuplementar(m.funcao) && cpfMatchesMasked(cpfDigits, m.cpf));
    if(found){
      return { equipe: equipeLetra, turnoLabel: TURNO_LABEL[t.turno], date: targetDate };
    }
  }
  return null;
}

// Verifica se o CPF, ao sair do turno Noite (18:00–06:00) do serviço normal,
// tem o mínimo de 8h de descanso antes do início da vaga extra no mesmo dia
// em que esse turno termina (06:00). O turno Noite que termina na manhã de
// 'dateStr' é o registrado no calendário no dia ANTERIOR (ele começa às
// 18:00 do dia anterior e vai até 06:00 de 'dateStr'). Sair do turno Dia não
// tem restrição — essa função só olha o turno Noite. Retorna null se não há
// conflito de descanso (ou se a escala oficial ainda não foi importada).
const DESCANSO_MIN_HORAS = 8;
function findRestConflict(dateStr, startTime, cpfDigits){
  if(!periodosEscala.length) return null;
  const prevDate = shiftDateStr(dateStr, -1);
  const diaCal = getEquipeDoTurno(prevDate);
  if(!diaCal) return null;
  const equipeLetra = diaCal.noite;
  if(!equipeLetra) return null;
  const periodo = getEscalaVigente(turnoStartISO(prevDate, 'noite'));
  if(!periodo) return null;
  const membros = periodo.equipes[equipeLetra];
  if(!membros) return null;
  const found = membros.find(m=> !isFuncaoSuplementar(m.funcao) && cpfMatchesMasked(cpfDigits, m.cpf));
  if(!found) return null;
  const toMin = t=>{ const [h,m]=t.split(':').map(Number); return h*60+m; };
  const liberadoAPartirDe = 6*60 + DESCANSO_MIN_HORAS*60; // 06:00 + 8h = 14:00
  if(toMin(startTime) < liberadoAPartirDe){
    return { equipe: equipeLetra };
  }
  return null;
}

// ---------- PUBLIC VIEW ----------

function renderVagas(){
  const el = document.getElementById('view-vagas');
  const today = new Date(); today.setHours(0,0,0,0);
  // Vagas com data ausente/malformada (dado antigo) são tratadas como não
  // futuras em vez de derrubar o filtro inteiro — ver parseDateStr.
  const upcoming = shifts.filter(s=>{ const p=parseDateStr(s && s.date); return p ? new Date(p.y,p.m-1,p.d) >= today : false; });
  const openCount = upcoming.filter(s=> signupsFor(s.id).length < (s.vagas || 0)).length;

  let html = '<div class="refresh-row"><span class="muted-sm">'+openCount+' vaga(s) em aberto</span><button class="link-btn" onclick="refreshAll()">Atualizar</button></div>';

  if(upcoming.length === 0){
    html += '<div class="card empty"><div class="big">Nenhuma vaga cadastrada</div>Assim que a administração publicar horários, eles aparecem aqui.</div>';
  } else {
    for(const s of upcoming){
      // Isola cada card num try/catch: um único registro com dado inesperado
      // (ex: campo ausente de uma vaga antiga) não pode derrubar a lista
      // inteira e deixar a aba pública sem nenhuma vaga visível.
      try{
        const su = signupsFor(s.id);
        const vagasTotal = s.vagas || 0;
        const cheias = su.length >= vagasTotal;
        const dp = fmtDateParts(s.date);
        html += '<div class="card shift-card" style="border-top-color:'+faseBorderColor(s.fase)+';">'
          + '<div class="shift-date"><div class="dow">'+dp.dow+'</div><div class="dnum">'+dp.dnum+'</div><div class="mon">'+dp.mon+'</div></div>'
          + '<div class="shift-body">'
          + '<div class="shift-time">'+(s.startTime||'--:--')+' – '+(s.endTime||'--:--')+'</div>'
          + (metaLine(s) ? '<div class="shift-local">'+metaLine(s)+'</div>' : '')
          + '<div class="shift-meta">'
          + '<span class="badge '+(cheias?'full':'open')+'">'+su.length+'/'+vagasTotal+' preenchidas</span>'
          + '<span class="badge phase">'+faseLabel(s.fase)+'</span>'
          + '</div>'
          + '<div style="margin-top:10px;">'
          + '<button class="btn btn-primary" '+(cheias?'disabled':'')+' onclick="openSignupModal(\''+s.id+'\')">'+(cheias?'Esgotado':'Voluntariar-se')+'</button>'
          + '</div>'
          + (su.length ? '<div class="names">'+su.map(x=>'<span class="name-chip">'+escapeHtml(x.nome)+' <span class="rank-tag '+escapeHtml(x.patente||'')+'">'+escapeHtml(RANK_LABEL[x.patente]||x.patente||'N/D')+'</span></span>').join('')+'</div>' : '')
          + '<button class="link-btn" style="margin-top:8px;" onclick="openCancelModal(\''+s.id+'\')">Cancelar meu voluntariado</button>'
          + '</div></div>';
      }catch(err){
        console.error('Erro ao renderizar vaga', s && s.id, err);
      }
    }
  }
  el.innerHTML = html;
}

function rankOptions(allowed){
  return RANK_ORDER.map(r=>'<option value="'+r+'" '+(allowed.includes(r)?'':'disabled')+'>'+RANK_LABEL[r]+(allowed.includes(r)?'':' (ainda não liberado)')+'</option>').join('');
}

function openSignupModal(shiftId){
  const s = shifts.find(x=>x.id===shiftId);
  if(!s) return;
  const dp = fmtDateParts(s.date);
  const allowed = allowedRanks(s.fase);
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal">'
    + '<h3>Confirmar voluntariado</h3>'
    + '<div class="shift-local" style="margin-bottom:6px;">'+dp.dnum+'/'+dp.mon+' &middot; '+s.startTime+'–'+s.endTime+(metaLine(s)?(' &middot; '+metaLine(s)):'')+'</div>'
    + '<div class="badge phase" style="margin-bottom:14px;">'+faseLabel(s.fase)+'</div>'
    + '<form id="su-form">'
    + '<div class="field"><label>Nome completo</label><input id="su-nome" list="datalist-nomes" placeholder="Ex: Sd Eduardo Silva"></div>'
    + '<div class="field"><label>Patente</label><select id="su-patente">'+rankOptions(allowed)+'</select></div>'
    + '<div class="field"><label>CPF</label><input id="su-cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric"></div>'
    + '<div class="modal-actions"><button type="button" class="btn btn-ghost" id="su-cancel">Cancelar</button><button type="submit" class="btn btn-primary" id="su-confirm">Confirmar</button></div>'
    + '</form>'
    + '</div>';
  document.body.appendChild(bg);
  const nomeInput = bg.querySelector('#su-nome');
  if(isDesktopViewport()) nomeInput.focus();
  const cpfInput = bg.querySelector('#su-cpf');
  cpfInput.oninput = ()=>{ cpfInput.value = maskCpf(cpfInput.value); };
  bg.querySelector('#su-cancel').onclick = ()=> bg.remove();
  bg.querySelector('#su-form').onsubmit = (e)=>{
    e.preventDefault();
    const nome = nomeInput.value.trim();
    const patenteEl = bg.querySelector('#su-patente');
    const patente = patenteEl.value;
    const cpfMasked = cpfInput.value.trim();
    const cpfDigits = cpfMasked.replace(/\D/g,'');
    if(!nome){ flagInvalid(nomeInput); showToast('Digite seu nome'); return; }
    if(cpfDigits.length !== 11){ flagInvalid(cpfInput); showToast('Digite um CPF válido'); return; }
    const freshShift = shifts.find(x=>x.id===shiftId);
    if(!freshShift){ showToast('Vaga não encontrada'); bg.remove(); return; }
    const su = signupsFor(shiftId);
    if(!allowedRanks(freshShift.fase).includes(patente)){ flagInvalid(patenteEl); showToast('Essa vaga ainda não está liberada para '+RANK_LABEL[patente]); return; }
    if(su.length >= freshShift.vagas){ showToast('Vaga esgotada, atualize a página'); bg.remove(); render(); return; }
    if(su.some(x=>x.nome.toLowerCase()===nome.toLowerCase())){ flagInvalid(nomeInput); showToast('Você já está nesta vaga'); return; }
    const conflict = findEscalaConflict(freshShift.date, freshShift.startTime, freshShift.endTime, cpfDigits);
    if(conflict){
      flagInvalid(cpfInput);
      showToast('Você já está escalado no serviço normal neste dia (Equipe '+conflict.equipe+', turno '+conflict.turnoLabel+'). Não é possível se voluntariar.');
      return;
    }
    const restConflict = findRestConflict(freshShift.date, freshShift.startTime, cpfDigits);
    if(restConflict){
      flagInvalid(cpfInput);
      showToast('Descanso insuficiente: você saiu do serviço noturno às 06:00 e precisa de 8 horas de descanso. Só é possível se voluntariar a partir das 14:00.');
      return;
    }
    const [vagaAno, vagaMes] = freshShift.date.split('-');
    const extrasNoMes = signups.filter(x=>{
      if((x.cpf||'').replace(/\D/g,'') !== cpfDigits) return false;
      const xs = shifts.find(sh=>sh.id===x.shiftId);
      if(!xs) return false;
      const [xAno, xMes] = xs.date.split('-');
      return xAno===vagaAno && xMes===vagaMes;
    }).length;
    if(extrasNoMes >= 10){
      flagInvalid(cpfInput);
      showToast('Limite de 10 extras no mês atingido para este CPF.');
      return;
    }
    const entry = { id: uid(), shiftId, nome, patente, cpf: cpfMasked, timestamp: new Date().toISOString() };
    signups.push(entry);
    bg.remove();
    showToast('Voluntariado confirmado!');
    render();
    persistSignupUpsert(entry);
  };
}

function openCancelModal(shiftId){
  const s = shifts.find(x=>x.id===shiftId);
  if(!s) return;
  const dp = fmtDateParts(s.date);
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal">'
    + '<h3>Cancelar voluntariado</h3>'
    + '<div class="shift-local" style="margin-bottom:14px;">'+dp.dnum+'/'+dp.mon+' &middot; '+s.startTime+'–'+s.endTime+(metaLine(s)?(' &middot; '+metaLine(s)):'')+'</div>'
    + '<form id="cn-form">'
    + '<div class="field"><label>Digite o nome que você usou pra se voluntariar</label><input id="cn-nome" list="datalist-nomes" placeholder="Ex: Sd Eduardo Silva"></div>'
    + '<div class="field"><label>CPF</label><input id="cn-cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric"></div>'
    + '<div class="modal-actions"><button type="button" class="btn btn-ghost" id="cn-cancel">Voltar</button><button type="submit" class="btn btn-danger" id="cn-confirm">Cancelar minha vaga</button></div>'
    + '</form>'
    + '</div>';
  document.body.appendChild(bg);
  const cnNomeInput = bg.querySelector('#cn-nome');
  if(isDesktopViewport()) cnNomeInput.focus();
  const cnCpfInput = bg.querySelector('#cn-cpf');
  cnCpfInput.oninput = ()=>{ cnCpfInput.value = maskCpf(cnCpfInput.value); };
  bg.querySelector('#cn-cancel').onclick = ()=> bg.remove();
  bg.querySelector('#cn-form').onsubmit = (e)=>{
    e.preventDefault();
    const nome = cnNomeInput.value.trim();
    const cpfDigits = cnCpfInput.value.replace(/\D/g,'');
    if(!nome){ flagInvalid(cnNomeInput); showToast('Digite seu nome'); return; }
    if(cpfDigits.length !== 11){ flagInvalid(cnCpfInput); showToast('Digite um CPF válido'); return; }
    const match = signupsFor(shiftId).find(x=>x.nome.toLowerCase()===nome.toLowerCase());
    if(!match){ flagInvalid(cnNomeInput); showToast('Nome não encontrado nesta vaga'); return; }
    const matchCpfDigits = (match.cpf||'').replace(/\D/g,'');
    if(matchCpfDigits !== cpfDigits){ flagInvalid(cnCpfInput); showToast('CPF não confere com o cadastro desta vaga'); return; }
    const removedId = match.id;
    signups = signups.filter(x=>x.id!==removedId);
    bg.remove();
    showToast('Voluntariado cancelado');
    render();
    persistSignupDelete(removedId);
  };
}

function removeSignup(id){
  signups = signups.filter(x=>x.id!==id);
  render();
  showToast('Removido');
  persistSignupDelete(id);
}

function setFase(shiftId, novaFase){
  const s = shifts.find(x=>x.id===shiftId);
  if(!s || s.fase === novaFase) return;
  s.fase = novaFase;
  showToast('Fase alterada: '+faseLabel(novaFase));
  render();
  persistShiftUpsert(s);
}

function faseQuickButtonsHtml(s){
  return '<div style="display:flex;gap:4px;">' + FASE_OPTIONS.map(o=>{
    const active = s.fase === o.v;
    const shortLabel = o.v==='soldado' ? 'Sd' : (o.v==='todos' ? 'Todos' : (o.v==='sgt' ? 'Sgt' : 'Cabo'));
    return '<button class="btn '+(active?'btn-blue':'btn-ghost')+' btn-sm" '+(active?'disabled':'')+' onclick="setFase(\''+s.id+'\',\''+o.v+'\')">'+shortLabel+'</button>';
  }).join('') + '</div>';
}

      showToast('Vaga adicionada');
      render();
      persistShiftUpsert(newShift);
    };
  }
  const loteOpenBtn = el.querySelector('#lote-open-btn');
  if(loteOpenBtn){ loteOpenBtn.onclick = openLoteImportModal; }
  const efCancel = el.querySelector('#ef-cancel');
  if(efCancel){ efCancel.onclick = ()=>{ editingShiftId = null; render(); }; }
  const efForm = el.querySelector('#ef-form');

      s.viatura = el.querySelector('#ef-viatura').value.trim();

      showToast('Vaga atualizada');

      persistShiftUpsert(s);

  }
  const lockBtn = el.querySelector('#lock-btn');
  if(lockBtn){ lockBtn.onclick = ()=>{ adminUnlocked = false; render(); }; }
  const changePinBtn = el.querySelector('#change-pin-btn');
  if(changePinBtn){ changePinBtn.onclick = openChangePinModal; }
}

    + '<div class="field"><label>PIN atual</label><input id="cp-atual" type="tel" maxlength="8" placeholder="••••"></div>'
    + '<div class="field"><label>Novo PIN</label><input id="cp-novo" type="tel" maxlength="8" placeholder="••••"></div>'
    + '<div class="field"><label>Confirmar novo PIN</label><input id="cp-confirma" type="tel" maxlength="8" placeholder="••••"></div>'
    + '<div class="modal-actions"><button type="button" class="btn btn-ghost" id="cp-cancel">Cancelar</button><button type="submit" class="btn btn-primary" id="cp-confirm">Salvar</button></div>'
    + '</form>'
    + '</div>';
  document.body.appendChild(bg);
  const cpAtualInput = bg.querySelector('#cp-atual');
  if(isDesktopViewport()) cpAtualInput.focus();
  bg.querySelector('#cp-cancel').onclick = ()=> bg.remove();
  bg.querySelector('#cp-form').onsubmit = (e)=>{
    e.preventDefault();
    const cpNovoInput = bg.querySelector('#cp-novo');
    const cpConfirmaInput = bg.querySelector('#cp-confirma');
    const atual = cpAtualInput.value.trim();
    const novo = cpNovoInput.value.trim();

    if(atual !== currentPin){ flagInvalid(cpAtualInput); showToast('PIN atual incorreto'); return; }
    if(!novo){ flagInvalid(cpNovoInput); showToast('Digite o novo PIN'); return; }
    if(novo !== confirma){ flagInvalid(cpNovoInput); flagInvalid(cpConfirmaInput); showToast('Os PINs não coincidem'); return; }
    currentPin = novo;
    bg.remove();
    showToast('PIN atualizado');
    persist({ pin: novo });
  };
}

// Modal de confirmação genérico, no mesmo padrão visual dos demais modais do
// app (modal-bg/modal/modal-actions) — substitui confirm() nativo do
// navegador para ações relevantes (o sistema está em produção com dados reais
// dos policiais, e um confirm() nativo é fácil demais de descartar/aceitar
// sem ler por reflexo). 'perigo:true' aplica o tom visual de alerta mais
// forte (ícone, mensagem em vermelho e botão de confirmação btn-danger) —
// use para ações destrutivas/irreversíveis; sem isso, o botão de confirmação
// usa btn-primary (ex: ações informativas, não-destrutivas).
function openConfirmModal({ titulo, mensagem, textoConfirmar, onConfirm, perigo }){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal">'
    + '<h3>'+escapeHtml(titulo)+'</h3>'
    + (perigo ? '<div style="font-size:30px;text-align:center;margin-bottom:8px;">⚠️</div>' : '')
    + '<div style="margin-bottom:16px;'+(perigo ? 'color:var(--red);font-weight:600;line-height:1.5;' : 'color:var(--muted);line-height:1.5;')+'">'+escapeHtml(mensagem)+'</div>'
    + '<div class="modal-actions"><button type="button" class="btn btn-ghost" id="confirm-cancel">Cancelar</button><button type="button" class="btn '+(perigo ? 'btn-danger' : 'btn-primary')+'" id="confirm-ok">'+escapeHtml(textoConfirmar||'Confirmar')+'</button></div>'
    + '</div>';
  document.body.appendChild(bg);
  bg.querySelector('#confirm-cancel').onclick = ()=> bg.remove();
  bg.querySelector('#confirm-ok').onclick = ()=>{ bg.remove(); onConfirm(); };
}

// ---------- IMPORTAÇÃO DA ESCALA MENSAL (PDF de equipes + calendário em DOCX/XLSX/ODS/CSV) ----------

function getFileExt(filename){
  const m = (filename||'').toLowerCase().match(/\.([a-z0-9]+)$/);
  return m ? m[1] : '';
}

// Bibliotecas de terceiros (ex: mammoth em certos .docx) podem, em casos
// raros, travar numa Promise que nunca resolve nem rejeita — sem essa corrida
// contra um timeout, o botão ficaria "Processando..." para sempre, sem
// nenhum feedback de erro pro admin.
function withTimeout(p, ms){
  return Promise.race([
    p,
    new Promise((_, reject)=> setTimeout(()=> reject(new Error('Tempo esgotado ao ler o arquivo (30s). O arquivo pode estar corrompido ou em formato incomum — tente novamente ou use outro formato (PDF/XLSX/ODS/CSV).')), ms))
  ]);
}

async function processEquipesImport(){
  const equipesInput = document.getElementById('imp-equipes');
  const vigInput = document.getElementById('imp-vigencia');
  const equipesFile = equipesInput && equipesInput.files[0];
  const vigencia = vigInput ? vigInput.value : '';
  if(!equipesFile){ showToast('Selecione o arquivo de escala de equipes'); return; }
  if(!vigencia){ flagInvalid(vigInput); showToast('Informe a partir de quando este período é vigente'); return; }

  const equipesExt = getFileExt(equipesFile.name);
  if(!['pdf','docx','xlsx','ods','csv'].includes(equipesExt)){ showToast('Formato de escala de equipes não suportado. Use PDF, DOCX, XLSX, ODS ou CSV.'); return; }
  if(equipesExt === 'pdf' && !window.pdfjsLib){ showToast('Biblioteca de leitura de PDF não carregou. Verifique sua conexão e recarregue a página.'); return; }
  if(equipesExt === 'docx' && !window.mammoth){ showToast('Biblioteca de leitura de DOCX não carregou. Verifique sua conexão e recarregue a página.'); return; }
  if(['xlsx','ods','csv'].includes(equipesExt) && !window.XLSX){ showToast('Biblioteca de leitura de planilhas não carregou. Verifique sua conexão e recarregue a página.'); return; }

  const btn = document.getElementById('imp-equipes-process');
  if(btn){ btn.disabled = true; btn.textContent = 'Processando...'; }
  try{
    const teams = await withTimeout(parseEquipesFile(equipesFile), 30000);
    openTeamsPreviewModal(teams, vigencia, null);
  }catch(e){
    console.error(e);
    showToast('Erro ao processar o arquivo: '+(e && e.message ? e.message : 'formato inesperado'));
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = 'Processar arquivo'; }
  }
}

// Detecta o formato do arquivo de escala de equipes pela extensão e direciona
// ao parser correto. Todos devolvem o mesmo formato de saída: { A:[...], B:[...], C:[...], D:[...] }.
async function parseEquipesFile(file){
  const ext = getFileExt(file.name);
  if(ext === 'pdf') return parseEquipesPdf(file);
  if(ext === 'docx') return parseEquipesDocx(file);
  if(ext === 'xlsx' || ext === 'ods' || ext === 'csv') return parseEquipesSpreadsheet(file);
  throw new Error('Formato de escala de equipes não suportado (.'+(ext||'?')+'). Use PDF, DOCX, XLSX, ODS ou CSV.');
}

// Detecta o formato do arquivo de calendário pela extensão e direciona ao
// parser correto. Os dois parsers (DOCX e planilha) sempre devolvem o mesmo
// formato de saída: { calendar, usedFallback }.
async function parseCalendarioFile(file){
  const ext = getFileExt(file.name);
  if(ext === 'docx') return parseCalendarioDocx(file);
  if(ext === 'xlsx' || ext === 'ods' || ext === 'csv') return parseCalendarioSpreadsheet(file);
  throw new Error('Formato de calendário não suportado (.'+(ext||'?')+'). Use DOCX, XLSX, ODS ou CSV.');
}

// --- PDF (escala de equipes) ---

async function parseEquipesPdf(file){
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
  const lines = [];
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    let lastY = null, cur = '';
    for(const item of content.items){
      const y = item.transform[5];
      if(lastY !== null && Math.abs(y-lastY) > 2){
        if(cur.trim()) lines.push(cur.trim());
        cur = '';
      }
      cur += item.str + ' ';
      lastY = y;
    }
    if(cur.trim()) lines.push(cur.trim());
  }
  return parseEquipesFromLines(lines);
}

// Um registro no PDF tem o formato "Função - Patente. QP PM Nome, CPF XXX.XXX.XXX-XX",
// mas a extração de texto do PDF pode quebrar isso em várias "linhas" — por isso
// concatenamos linhas num buffer até encontrar um CPF completo.
const CPF_COMPLETE_RE = /CPF[:\s]*([0-9Xx]{3}\.[0-9Xx]{3}\.[0-9Xx]{3}-[0-9Xx]{2})/i;
// Função e Patente são separadas por um traço cercado de espaços (" - "),
// o que evita confundir com um traço "colado" dentro do próprio nome da
// função (ex: "Adjunto-COPOM"). A função é o texto não-guloso antes desse
// primeiro traço espaçado; a patente é o texto entre o traço e o ponto.
const REGISTRO_RE = /^(.*?)\s-\s+([^.]+?)\.\s*QP\s*PM\s*([^,]+?),\s*CPF[:\s]*([0-9Xx]{3}\.[0-9Xx]{3}\.[0-9Xx]{3}-[0-9Xx]{2})/i;
// Usado apenas no fallback abaixo, quando o registro não bate com o formato
// completo — tenta extrair só a função (melhor esforço).
const FUNCAO_LOOSE_RE = /^(.*?)\s-\s+/;

function parseEquipesFromLines(lines){
  const teams = { A:[], B:[], C:[], D:[] };
  let currentTeam = null;
  let buffer = '';
  const flushBuffer = ()=>{
    if(!currentTeam || !buffer.trim()){ buffer=''; return; }
    const m = buffer.match(REGISTRO_RE);
    if(m){
      const cpf = m[4].trim().toUpperCase();
      teams[currentTeam].push({ funcao: m[1].trim(), patente: m[2].trim(), nome: m[3].trim(), cpf, cpfSuspeito: !isValidCpfShape(cpf) });
    } else {
      const cpfLoose = buffer.match(CPF_COMPLETE_RE);
      const funcaoLoose = buffer.match(FUNCAO_LOOSE_RE);
      teams[currentTeam].push({
        funcao: funcaoLoose ? funcaoLoose[1].trim() : '',
        nome: buffer.replace(CPF_COMPLETE_RE,'').replace(/QP\s*PM/i,'').trim().slice(0,80),
        patente: '',
        cpf: cpfLoose ? cpfLoose[1].toUpperCase() : '',
        cpfSuspeito: true
      });
    }
    buffer = '';
  };
  for(const raw of lines){
    const line = raw.trim();
    if(!line) continue;
    const teamMatch = line.match(/EQUIPE\s*([A-D])\b/i);
    if(teamMatch){
      flushBuffer();
      currentTeam = teamMatch[1].toUpperCase();
      continue;
    }
    if(!currentTeam) continue; // texto antes da primeira "Equipe X" (cabeçalho do documento) é ignorado
    buffer += (buffer ? ' ' : '') + line;
    if(CPF_COMPLETE_RE.test(buffer)) flushBuffer();
  }
  flushBuffer();
  return teams;
}

// --- DOCX (escala de equipes) ---
// Extrai texto simples do documento (sem tabela) e reaproveita o mesmo
// parser de linhas usado no PDF, já que o formato do registro é o mesmo texto
// corrido ("Equipe X" seguido de "Função - Patente. QP PM Nome, CPF ...").
async function parseEquipesDocx(file){
  const buf = await file.arrayBuffer();
  const result = await window.mammoth.extractRawText({ arrayBuffer: buf });
  const lines = result.value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  return parseEquipesFromLines(lines);
}

// --- Planilha (escala de equipes: XLSX / ODS / CSV) ---
// Aceita dois formatos: (1) estruturado, com colunas de cabeçalho
// Equipe/Patente/Nome/CPF (em qualquer ordem/posição, em qualquer aba); ou
// (2) texto corrido nas células, reaproveitando o mesmo parser de linhas do
// PDF/DOCX (concatena as células de cada linha da planilha como se fossem
// uma linha de texto extraída do documento).
function tryParseStructuredEquipesRows(rows){
  let headerRowIdx = -1, colMap = null;
  for(let r=0; r<Math.min(rows.length, 30); r++){
    const row = rows[r] || [];
    const map = {};
    row.forEach((cell, c)=>{
      const t = String(cell==null?'':cell).trim().toUpperCase();
      if(/^EQUIPE/.test(t)) map.equipe = c;
      else if(/^PATENTE/.test(t)) map.patente = c;
      else if(/^NOME/.test(t)) map.nome = c;
      else if(/^CPF/.test(t)) map.cpf = c;
      else if(/^FUN[CÇ]/.test(t) || /^CARGO/.test(t) || /^POSTO/.test(t)) map.funcao = c;
    });
    if(map.equipe!=null && map.nome!=null && map.cpf!=null){ headerRowIdx = r; colMap = map; break; }
  }
  if(headerRowIdx === -1) return null;

  const teams = { A:[], B:[], C:[], D:[] };
  for(let r=headerRowIdx+1; r<rows.length; r++){
    const row = rows[r] || [];
    const equipeRaw = colMap.equipe!=null ? String(row[colMap.equipe]==null?'':row[colMap.equipe]).trim().toUpperCase() : '';
    const equipeMatch = equipeRaw.match(/([A-D])/);
    if(!equipeMatch) continue;
    const letter = equipeMatch[1];
    const nome = colMap.nome!=null ? String(row[colMap.nome]==null?'':row[colMap.nome]).trim() : '';
    const patente = colMap.patente!=null ? String(row[colMap.patente]==null?'':row[colMap.patente]).trim() : '';
    const cpf = colMap.cpf!=null ? String(row[colMap.cpf]==null?'':row[colMap.cpf]).trim().toUpperCase() : '';
    const funcao = colMap.funcao!=null ? String(row[colMap.funcao]==null?'':row[colMap.funcao]).trim() : '';
    if(!nome && !cpf) continue;
    teams[letter].push({ funcao, nome, patente, cpf, cpfSuspeito: !isValidCpfShape(cpf) });
  }
  return teams;
}

async function parseEquipesSpreadsheet(file){
  const ext = getFileExt(file.name);
  let workbook;
  if(ext === 'csv'){
    const text = await file.text();
    workbook = window.XLSX.read(text, { type: 'string' });
  } else {
    const buf = await file.arrayBuffer();
    workbook = window.XLSX.read(new Uint8Array(buf), { type: 'array' });
  }

  for(const sheetName of workbook.SheetNames){
    const sheet = workbook.Sheets[sheetName];
    const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
    const structured = tryParseStructuredEquipesRows(rows);
    if(structured) return structured;
  }

  // Nenhuma aba tinha cabeçalho estruturado reconhecível: trata cada linha
  // da planilha como texto corrido e reaproveita o parser de linhas do PDF.
  const lines = [];
  for(const sheetName of workbook.SheetNames){
    const sheet = workbook.Sheets[sheetName];
    const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
    for(const row of rows){
      const text = (row||[]).map(c=> String(c==null?'':c).trim()).filter(Boolean).join(' ');
      if(text) lines.push(text);
    }
  }
  return parseEquipesFromLines(lines);
}

// --- DOCX (calendário mensal) ---

const MESES_PT = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];

async function parseCalendarioDocx(file){
  const buf = await file.arrayBuffer();
  const result = await window.mammoth.convertToHtml({ arrayBuffer: buf });
  const container = document.createElement('div');
  container.innerHTML = result.value;

  const tables = Array.from(container.querySelectorAll('table'));
  if(tables.length === 0) throw new Error('Nenhuma tabela encontrada no documento DOCX');

  const headingFor = (table)=>{
    let node = table.previousElementSibling;
    let hops = 0;
    while(node && hops < 6){
      const t = (node.textContent||'').trim();
      if(t) return t.toUpperCase();
      node = node.previousElementSibling;
      hops++;
    }
    return '';
  };

  const today = new Date();
  const currentMonthName = MESES_PT[today.getMonth()];
  const currentYear = String(today.getFullYear());

  let targetTable = tables[0];
  let usedFallback = tables.length > 1;
  if(tables.length > 1){
    for(const t of tables){
      const heading = headingFor(t);
      if(heading.includes(currentMonthName) && heading.includes(currentYear)){
        targetTable = t; usedFallback = false; break;
      }
    }
  }

  const heading = headingFor(targetTable);
  const yearMatch = heading.match(/(\d{4})/);
  const year = yearMatch ? parseInt(yearMatch[1],10) : today.getFullYear();

  const calendar = {};
  const rows = Array.from(targetTable.querySelectorAll('tr'));
  for(const row of rows){
    const cells = Array.from(row.querySelectorAll('td,th')).map(c=>(c.textContent||'').trim());
    if(cells.length < 4) continue;
    const dm = cells[0].match(/^(\d{1,2})\/(\d{1,2})/);
    if(!dm) continue; // linha de cabeçalho ou vazia
    const dateStr = year+'-'+dm[2].padStart(2,'0')+'-'+dm[1].padStart(2,'0');
    calendar[dateStr] = { dia: (cells[2]||'').toUpperCase(), noite: (cells[3]||'').toUpperCase() };
  }

  return { calendar, usedFallback };
}

// --- Planilha (XLSX / ODS / CSV) ---

// Converte uma célula de data em {day, month}, aceitando tanto texto "dd/mm"
// quanto data serializada do Excel/ODS (célula formatada como data).
function excelCellToDayMonth(val){
  if(val instanceof Date && !isNaN(val)){
    // A SheetJS (cellDates:true) cria o Date de uma célula de data ancorado em
    // UTC meia-noite (Date.UTC internamente). Ler com getDate()/getMonth()
    // (getters em fuso LOCAL) faz o dia "voltar" em fusos atrás de UTC (ex:
    // Brasil, UTC-3) — 01/08 UTC vira 31/07 23:59 no navegador. Por isso
    // usamos os getters UTC, que refletem o dia/mês exatamente como estavam
    // na planilha, sem depender do fuso horário do navegador.
    return { day: val.getUTCDate(), month: val.getUTCMonth()+1 };
  }
  if(typeof val === 'number' && window.XLSX && window.XLSX.SSF){
    try{
      const parsed = window.XLSX.SSF.parse_date_code(val);
      if(parsed) return { day: parsed.d, month: parsed.m };
    }catch(e){}
  }
  const s = String(val==null ? '' : val).trim();
  const m = s.match(/^(\d{1,2})\/(\d{1,2})/);
  if(m) return { day: parseInt(m[1],10), month: parseInt(m[2],10) };
  return null;
}

// A planilha pode ter várias abas (uma por mês) e, dentro de uma aba, duas
// tabelas lado a lado (RPA/COPOM e DPM, separadas por uma coluna em branco).
// Localizamos todas as células de título "RPA/COPOM" (a tabela DPM é
// ignorada por não ter turno Noite estruturado) em todas as abas, escolhemos
// a que bate com o mês/ano atual (mesma lógica usada no DOCX) e extraímos os
// dados a partir da linha de cabeçalho "Data" logo abaixo do título.
async function parseCalendarioSpreadsheet(file){
  const ext = getFileExt(file.name);
  let workbook;
  if(ext === 'csv'){
    const text = await file.text();
    workbook = window.XLSX.read(text, { type: 'string' });
  } else {
    const buf = await file.arrayBuffer();
    workbook = window.XLSX.read(new Uint8Array(buf), { type: 'array', cellDates: true });
  }

  const today = new Date();
  const currentMonthName = MESES_PT[today.getMonth()];
  const currentYear = String(today.getFullYear());

  const candidates = [];
  for(const sheetName of workbook.SheetNames){
    const sheet = workbook.Sheets[sheetName];
    const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: '' });
    for(let r=0; r<rows.length; r++){
      const row = rows[r] || [];
      for(let c=0; c<row.length; c++){
        const text = (row[c]==null ? '' : String(row[c])).toUpperCase();
        if(/RPA/.test(text) && /COPOM/.test(text)){
          candidates.push({ sheetName, rows, row: r, col: c, titleText: text });
        }
      }
    }
  }
  if(candidates.length === 0) throw new Error('Nenhuma tabela "Equipes RPA/COPOM" encontrada na planilha');

  let chosen = candidates[0];
  let usedFallback = candidates.length > 1;
  if(candidates.length > 1){
    const match = candidates.find(c=> c.titleText.includes(currentMonthName) && c.titleText.includes(currentYear));
    if(match){ chosen = match; usedFallback = false; }
  }

  const yearMatch = chosen.titleText.match(/(\d{4})/);
  const year = yearMatch ? parseInt(yearMatch[1],10) : today.getFullYear();

  // Localiza a linha de cabeçalho ("Data") logo abaixo do título, na mesma coluna.
  const rows = chosen.rows;
  let headerRow = -1;
  for(let r = chosen.row+1; r < Math.min(chosen.row+5, rows.length); r++){
    const cell = rows[r] && rows[r][chosen.col];
    if(cell!=null && /^DATA$/i.test(String(cell).trim())){ headerRow = r; break; }
  }
  if(headerRow === -1) throw new Error('Não foi possível localizar o cabeçalho da tabela RPA/COPOM (linha "Data")');

  // Ordem de colunas a partir do título, conforme o padrão da planilha:
  // Data, Dia semana, Dia, Noite, Descanso(24h), Folga(48h).
  const dataCol = chosen.col, diaCol = chosen.col+2, noiteCol = chosen.col+3;
  const calendar = {};
  for(let r = headerRow+1; r < rows.length; r++){
    const row = rows[r] || [];
    const dm = excelCellToDayMonth(row[dataCol]);
    if(!dm){
      const next = rows[r+1] || [];
      if(!excelCellToDayMonth(next[dataCol])) break; // duas linhas em branco seguidas = fim da tabela
      continue;
    }
    const dateStr = year+'-'+String(dm.month).padStart(2,'0')+'-'+String(dm.day).padStart(2,'0');
    const dia = row[diaCol]!=null ? String(row[diaCol]).trim().toUpperCase() : '';
    const noite = row[noiteCol]!=null ? String(row[noiteCol]).trim().toUpperCase() : '';
    calendar[dateStr] = { dia, noite };
  }

  return { calendar, usedFallback };
}

// --- Tela de prévia/conferência ---

function buildImportMemberRowHtml(letter, idx, m){
  m = m || {};
  return '<div data-imp-row style="margin-bottom:4px;">'
    + '<div class="row4" style="align-items:center;">'
    + '<input data-imp-team="'+letter+'" data-imp-idx="'+idx+'" data-imp-field="funcao" value="'+escapeHtml(m.funcao||'')+'" placeholder="Função">'

function buildTeamSectionHtml(letter, members){
  let rowsHtml = '';
  if(members.length === 0){
    rowsHtml = '<div class="muted-sm" data-imp-empty>Nenhum policial identificado para esta equipe.</div>';

    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">'

    + '<button type="button" class="btn btn-ghost btn-sm" onclick="addImportMember(\''+letter+'\')" title="Adicionar policial">+</button>'
    + '</div>'

    + '</div>';

let impNextRowIdx = 1000000; // base alto pra nunca colidir com os índices originais (0..n-1) dos membros já existentes

function addImportMember(letter){
  const section = document.querySelector('[data-imp-team-section="'+letter+'"]');
  if(!section) return;
  const rowsContainer = section.querySelector('[data-imp-rows]');
  const emptyMsg = rowsContainer.querySelector('[data-imp-empty]');
  if(emptyMsg) emptyMsg.remove();
  const wrapper = document.createElement('div');
  wrapper.innerHTML = buildImportMemberRowHtml(letter, impNextRowIdx++, {});
  rowsContainer.appendChild(wrapper.firstChild);
  updateImportTeamCount(section, letter);
}

function removeImportMember(btn){
  const row = btn.closest('[data-imp-row]');
  const section = row.closest('[data-imp-team-section]');
  const letter = section.getAttribute('data-imp-team-section');
  row.remove();
  const rowsContainer = section.querySelector('[data-imp-rows]');
  if(rowsContainer.children.length === 0){
    rowsContainer.innerHTML = '<div class="muted-sm" data-imp-empty>Nenhum policial identificado para esta equipe.</div>';
  }
  updateImportTeamCount(section, letter);
}

function updateImportTeamCount(section, letter){
  const title = section.querySelector('[data-imp-team-title]');
  const count = section.querySelectorAll('[data-imp-row]').length;
  if(title) title.textContent = 'Equipe '+letter+' ('+count+')';
}

// Cada linha traz um botão "✕" pra remover a data (mesmo padrão de
// removeImportMember pros policiais). Isso é essencial: a tela "Editar
// Manualmente" sempre parte de uma CÓPIA do calendarioOficial já salvo, e o
// botão "Confirmar e salvar" resubmete TODAS as linhas presentes na tabela.
// Sem uma forma de excluir uma linha aqui, uma data indevida que tenha
// entrado no calendário uma vez (import antigo, teste, edição) nunca sai —
// ela é resalva como "válida" a cada novo salvamento, mesmo depois da
// importação passar a substituir o campo inteiro (updateDoc) em vez de fazer
// merge raso.
function buildCalendarSectionHtml(calendar){
  const dates = Object.keys(calendar).sort();
  let html = '<div class="section-title accent" style="font-size:13px;margin:16px 0 8px;" data-imp-cal-title>Calendário ('+dates.length+' dia(s))</div>';
  if(dates.length === 0){
    html += '<div class="muted-sm" data-imp-cal-empty>Nenhum dia identificado no calendário.</div>';
  } else {
    html += '<div class="table-wrap"><table class="roster" data-imp-cal-table><thead><tr><th>Data</th><th>Dia</th><th>Noite</th><th></th></tr></thead><tbody>';
    dates.forEach(dateStr=>{ html += buildImportCalendarRowHtml(dateStr, calendar[dateStr]); });
    html += '</tbody></table></div>';
  }
  return html;
}

function buildImportCalendarRowHtml(dateStr, entry){
  entry = entry || {};
  const dp = fmtDateParts(dateStr);
  return '<tr data-imp-cal-row="'+dateStr+'"><td>'+dp.dnum+'/'+dp.mon+'</td>'
    + '<td><input data-imp-cal-date="'+dateStr+'" data-imp-cal-field="dia" value="'+escapeHtml(entry.dia||'')+'" style="max-width:56px;"></td>'
    + '<td><input data-imp-cal-date="'+dateStr+'" data-imp-cal-field="noite" value="'+escapeHtml(entry.noite||'')+'" style="max-width:56px;"></td>'
    + '<td><button type="button" class="link-btn" style="color:var(--red);" onclick="removeImportCalendarDate(this)" title="Remover esta data do calendário">✕</button></td></tr>';
}

function removeImportCalendarDate(btn){
  const row = btn.closest('[data-imp-cal-row]');
  const wrap = row.closest('.table-wrap');
  row.remove();
  const table = wrap ? wrap.querySelector('[data-imp-cal-table]') : null;
  const remaining = table ? table.querySelectorAll('[data-imp-cal-row]').length : 0;
  const title = document.querySelector('[data-imp-cal-title]');
  if(title) title.textContent = 'Calendário ('+remaining+' dia(s))';
  if(remaining === 0 && wrap){
    wrap.outerHTML = '<div class="muted-sm" data-imp-cal-empty>Nenhum dia identificado no calendário.</div>';
  }
}

// Formata vigenciaInicio ('YYYY-MM-DDTHH:mm') para exibição, ex:
// "Vigente desde 04/09/2026 06:00".
function fmtVigenciaLabel(vig){
  if(!vig || typeof vig !== 'string' || vig.indexOf('T') === -1) return 'Vigente desde --';
  const [dateStr, timeStr] = vig.split('T');
  return 'Vigente desde '+fmtDateNumeric(dateStr)+' '+(timeStr||'00:00');
}

// Garante no máximo um período por vigenciaInicio (a última ocorrência na
// lista, em ordem de array, prevalece) e devolve a lista ordenada. Usada após
// qualquer inserção/edição de período — cobre tanto o caso de reimportar uma
// vigência já existente (corrige/sobrescreve aquele período específico, sem
// apagar os demais) quanto o caso raro de editar manualmente um período para
// ter a mesma vigenciaInicio de outro já cadastrado.
function normalizePeriodos(list){
  const map = new Map();
  list.forEach(p=>{ map.set(p.vigenciaInicio, p); });
  return Array.from(map.values()).sort((a,b)=> a.vigenciaInicio.localeCompare(b.vigenciaInicio));
}

// Insere um novo período (periodoId null) ou atualiza um já existente
// (periodoId informado — fluxo "Editar" de um período já cadastrado).
function upsertPeriodoEscala(periodoId, vigenciaInicio, equipes){
  if(periodoId){
    const idx = periodosEscala.findIndex(x=>x.id===periodoId);
    if(idx !== -1) periodosEscala[idx] = { id: periodoId, vigenciaInicio, equipes };
    else periodosEscala.push({ id: periodoId, vigenciaInicio, equipes });
  } else {
    periodosEscala.push({ id: uid(), vigenciaInicio, equipes });
  }
  periodosEscala = normalizePeriodos(periodosEscala);
  persistPeriodosEscala(periodosEscala);
}

function editPeriodo(id){
  const p = periodosEscala.find(x=>x.id===id);
  if(!p) return;
  const teamsCopy = JSON.parse(JSON.stringify(p.equipes));
  openTeamsPreviewModal(teamsCopy, p.vigenciaInicio, p.id);
}

function deletePeriodo(id){
  const p = periodosEscala.find(x=>x.id===id);
  if(!p) return;
  if(!confirm('Remover o período "'+fmtVigenciaLabel(p.vigenciaInicio)+'"? Isso não pode ser desfeito.')) return;
  periodosEscala = periodosEscala.filter(x=>x.id!==id);
  showToast('Período removido');
  render();
  persistPeriodosEscala(periodosEscala);
}

// Tela de prévia/conferência de um período de escala de equipes (import novo
// ou edição de um período já cadastrado — distinguido por periodoId).
function openTeamsPreviewModal(teams, vigenciaInicio, periodoId){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  let inner = '<div class="modal" style="max-width:640px;">'
    + '<h3>'+(periodoId ? 'Editar período de escala' : 'Conferir escala de equipes importada')+'</h3>'
    + '<div class="muted-sm" style="margin-bottom:12px;">Revise os campos abaixo — a extração automática pode errar. Corrija o que precisar antes de salvar.</div>'
    + '<div class="field"><label>Vigente a partir de</label><input type="datetime-local" id="imp-vigencia-modal" value="'+escapeHtml(vigenciaInicio||'')+'"></div>';
  TEAM_LETTERS.forEach(letter=>{ inner += buildTeamSectionHtml(letter, teams[letter] || []); });
  inner += '<div class="modal-actions"><button class="btn btn-ghost" id="imp-cancel">Cancelar</button><button class="btn btn-primary" id="imp-confirm">Confirmar e salvar</button></div>'
    + '</div>';
  bg.innerHTML = inner;
  document.body.appendChild(bg);
  bg.querySelector('#imp-cancel').onclick = ()=> bg.remove();
  bg.querySelector('#imp-confirm').onclick = ()=>{

    bg.querySelectorAll('[data-imp-team]').forEach(input=>{
      const letter = input.getAttribute('data-imp-team');
      const idx = parseInt(input.getAttribute('data-imp-idx'), 10);

// Tela de prévia/conferência do calendário mensal (import novo ou edição
